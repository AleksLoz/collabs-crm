<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f5f5; --surface:#fff; --line:#e6e6e6; --line-2:#ededed; --line-3:#e0e0e0;
  --dash:#d4d4d4; --dash-2:#c4c4c4; --ink:#000; --ink-2:#6b6b6b; --muted:#9a9a9a; --faint:#b0b0b0;
  --fill:#f2f2f2; --hot:#ececec; --cell:#fafafa; --knob-on:#333; --scrim:rgba(0,0,0,.26);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
a:hover{color:var(--ink-2)}
::selection{background:var(--line)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.kicker{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--dash-2);font-size:12px;line-height:1;padding:0}
.x:hover{background:var(--bg);color:var(--ink)}
.quiet{background:transparent;border:0;border-radius:6px;padding:1px 4px;margin-left:-4px}
.quiet:hover{background:var(--bg)}
.qsel{border:0;background:transparent;padding:0;font-size:12.5px;max-width:100%;cursor:pointer}
.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 16px;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn-dark{border:0;border-radius:9px;background:var(--ink);color:var(--surface);padding:8px 18px;font-size:13px;font-weight:500;white-space:nowrap}
.btn-dark:hover{background:var(--knob-on)}
.btn-dark:disabled{opacity:.5;cursor:default}
.pills{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto}
.pill{border:0;border-radius:999px;white-space:nowrap;padding:8px 17px;font-size:13px;font-weight:500;background:transparent;color:var(--muted)}
.pill.on{background:var(--ink);color:var(--surface)}
.field{width:100%;background:var(--bg);border:1px solid transparent;border-radius:9px;padding:8px 10px;font-size:13px}
.field:focus{border-color:var(--ink);outline:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:16px 28px 0}
.hdr-row{display:flex;align-items:center;gap:26px;padding-bottom:14px;border-bottom:1px solid var(--line-3);flex-wrap:wrap;row-gap:10px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.035em}
.tabs{display:flex;gap:22px}
.tab{border:0;background:transparent;padding:3px 0;font-size:15px;font-weight:500;letter-spacing:-.015em;border-bottom:2px solid transparent;color:var(--muted)}
.tab.on{border-bottom-color:var(--ink);color:var(--ink)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.toggle{display:flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);color:var(--ink-2);padding:5px 12px 5px 5px;font-size:12px}
.toggle.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.knob{display:flex;width:26px;height:15px;border-radius:999px;padding:2px;background:var(--line);justify-content:flex-start}
.toggle.on .knob{background:var(--knob-on);justify-content:flex-end}
.knob span{width:11px;height:11px;border-radius:50%;background:#fff}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);padding:4px 12px 4px 4px}
.acct:hover{border-color:var(--ink)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600}
.sync{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* dashboard */
.page{padding:26px 28px 60px;max-width:1640px}
.title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:18px 20px}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.02;margin-top:14px}
.kpi-delta{font-size:12.5px;font-weight:500;margin-top:3px}
.kpi-sub{font-size:12px;color:var(--ink-2);margin-top:10px}
.chart-row{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:12px;margin-bottom:24px}
.chart-card{padding:18px 22px 10px;min-width:0}
.goal-card{padding:18px 20px;display:flex;flex-direction:column;align-items:center}
.goal-input{width:78px;text-align:right;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 3px;font-size:12.5px;color:var(--ink-2)}
.goal-input:hover{background:var(--bg)}
.goal-input:focus{border-color:var(--ink);outline:none}

.todo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px 28px;margin-bottom:26px}
.todo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;row-gap:28px}
.task{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.check{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0}
.check.done{background:var(--ink)}
.add-row{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:4px 0;background:transparent;border:0;font-size:13px;color:var(--muted)}
.add-row:hover{color:var(--ink)}
.add-dot{width:22px;height:22px;border:1px dashed var(--dash-2);border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{border-radius:16px;padding:8px 6px 16px;min-height:180px}
.col.hot{background:var(--hot)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer}
.kcard:hover{border-color:var(--ink)}
.clamp{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-drop{border:1px dashed var(--dash);border-radius:14px;padding:22px;text-align:center;font-size:12px;color:var(--faint)}
.add-collab{border:1px dashed var(--dash);border-radius:14px;padding:11px;background:transparent;font-size:12.5px;color:var(--muted)}
.add-collab:hover{border-color:var(--ink);color:var(--ink)}

/* calendar */
.cal-wrap{display:flex;align-items:stretch;gap:12px;padding:24px 28px 44px}
.cal-main{flex:1;min-width:0}
.nav-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;padding:0}
.nav-btn:hover{border-color:var(--ink)}
.grid-scroll{overflow-x:auto}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:620px}
.cell{border-radius:10px;padding:8px;cursor:pointer;background:var(--cell)}
.cell.hot{background:var(--hot)}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px;cursor:grab;min-width:0}
.chip.idea{border:1px dashed var(--dash-2)}
.chip:hover{border-color:var(--ink)}
.chip-t{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row{display:grid;grid-template-columns:128px minmax(0,2fr) minmax(0,1fr) 106px;gap:16px;align-items:center;padding:13px 8px;border-bottom:1px solid var(--line-2);border-radius:9px;cursor:pointer}
.list-row:hover{background:var(--bg)}
.side{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.side.hot{background:var(--hot)}
.uns{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:9px 11px;cursor:grab}
.uns:hover{border-color:var(--ink)}
.uns-idea{border:1px dashed var(--dash);border-radius:10px;padding:8px 9px;cursor:grab}
.uns-idea:hover{border-style:solid;border-color:var(--ink)}
.quiet-w:hover{background:var(--surface)}

/* contacts */
.ctable{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 20px 14px;overflow-x:auto}
.crow{display:grid;grid-template-columns:minmax(124px,1fr) minmax(110px,.8fr) minmax(150px,.9fr) 118px 78px 118px 118px 52px;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line-2);border-radius:9px;align-items:center;min-width:920px}
.crow.head{padding:14px 8px 10px;border-bottom-color:var(--line);border-radius:0}
.crow:not(.head):hover{background:var(--cell)}
.cin{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:7px;padding:3px 5px;margin-left:-5px;text-overflow:ellipsis}
.cin:hover{background:var(--surface);border-color:var(--line)}
.cin:focus{border-color:var(--ink);outline:none;background:var(--surface)}
.date-in{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 6px;font-size:12px;color:var(--ink-2)}
.date-in:hover{border-color:var(--line);background:var(--surface)}
.date-in:focus{border-color:var(--ink);outline:none}
.due{background:var(--ink);border-radius:8px}
.due .date-in{color:var(--surface);font-weight:500;color-scheme:dark}
.due .date-in:hover{background:transparent;border-color:var(--ink-2)}
.sel-box{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 10px;font-size:12.5px}

/* overlays */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.panel-wrap{display:flex;justify-content:flex-end;padding:12px}
.panel{width:min(640px,100%);height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.panel-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:20px 26px 14px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.panel-body{padding:18px 26px 56px}
.psel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 11px;font-size:12.5px;max-width:100%}
.stat{background:var(--bg);border-radius:12px;padding:13px 15px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.del{background:var(--bg);border-radius:12px;padding:12px 14px}
.del-date{width:100%;background:var(--surface);border:1px solid transparent;border-radius:8px;padding:5px 8px;font-size:11.5px}
.del-date:focus{border-color:var(--ink);outline:none}
.center{display:grid;place-items:center;padding:20px;z-index:60}
.dialog{width:min(380px,100%);background:var(--surface);border-radius:16px;padding:24px 26px 20px}
.dialog h4{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.022em}

/* auth gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding:20px}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px}
.gate-card h1{font-size:22px;margin-bottom:6px}
.gate-card p{font-size:13px;color:var(--ink-2);margin:0 0 20px;line-height:1.5}
.gate-msg{font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.5}
.gate-err{font-size:12.5px;color:#b3261e;margin-top:14px;line-height:1.5}

@media (max-width: 980px){
  .chart-row{grid-template-columns:minmax(0,1fr)}
  .cal-wrap{flex-direction:column}
  .side{width:100% !important}
}
@media (max-width: 760px){
  .hdr{padding:12px 16px 0}
  .hdr-row{gap:14px}
  .hdr-right{margin-left:0;width:100%;justify-content:flex-end;flex-wrap:wrap;gap:8px 10px}
  .today-lbl,.sync{display:none}
  .page,.cal-wrap{padding:20px 16px 48px}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .todo{padding:20px 18px}
  .ctable{padding:4px 12px 12px}
  .panel-wrap{padding:0}
  .panel{border-radius:0}
  .panel-head,.panel-body{padding-left:18px;padding-right:18px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .list-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .list-row .lr-meta{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- auth: real Supabase login shared by the whole team ---------- */
function useAuth(){
  const [state,setState]=useState({loading:SUPABASE_READY,session:null});
  useEffect(()=>{
    if(!SUPABASE_READY){setState({loading:false,session:null});return}
    let alive=true;
    supabase.auth.getSession()
      .then(({data})=>{if(alive)setState({loading:false,session:data.session})})
      .catch(err=>{console.warn("getSession failed",err);if(alive)setState({loading:false,session:null})});
    const {data:sub}=supabase.auth.onAuthStateChange((_event,session)=>{if(alive)setState({loading:false,session})});
    return()=>{alive=false;sub.subscription.unsubscribe()};
  },[]);
  return state;
}

/* Shopify sales come from /api/shopify-sales (a Vercel function that holds the
   Shopify credential server-side). status: off | loading | ready | error */
function useShopify(){
  const [state,setState]=useState({status:SUPABASE_READY?"loading":"off"});
  useEffect(()=>{
    if(!SUPABASE_READY)return;
    let alive=true;
    const set=v=>{if(alive)setState(v)};
    supabase.auth.getSession().then(({data})=>{
      if(!data.session){set({status:"error",error:"Sign in to load"});return}
      return fetch("/api/shopify-sales",{headers:{Authorization:"Bearer "+data.session.access_token}})
        .then(r=>r.json().then(j=>({ok:r.ok,j})))
        .then(({ok,j})=>set(ok?{status:"ready",currency:j.currency,months:j.months}:{status:"error",error:j.error||"Couldn't load Shopify sales"}));
    }).catch(()=>set({status:"error",error:"Couldn't reach Shopify sales"}));
    return()=>{alive=false};
  },[]);
  return state;
}

function LoginGate(){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const submit=async e=>{
    e.preventDefault();
    const v=email.trim();
    if(!v||!password)return;
    setBusy(true);setErr("");
    const {error}=await supabase.auth.signInWithPassword({email:v,password});
    setBusy(false);
    if(error)setErr(error.message);
  };
  return html`<div className="gate">
    <div className="gate-card">
      <h1>Collabs</h1>
      <p>Sign in with your team account to see and edit the shared board. New teammate? Ask whoever set this up to add your account in Supabase.</p>
      <form onSubmit=${submit}>
        <label style=${{display:"block",marginBottom:14}}>
          <span className="kicker" style=${{display:"block",marginBottom:5}}>Email</span>
          <input id="login-email" className="field" type="email" autoFocus required value=${email} onChange=${val(setEmail)} placeholder="you@byggeligt.com"/>
        </label>
        <label style=${{display:"block",marginBottom:14}}>
          <span className="kicker" style=${{display:"block",marginBottom:5}}>Password</span>
          <input id="login-password" className="field" type="password" required value=${password} onChange=${val(setPassword)} placeholder="••••••••"/>
        </label>
        <button type="submit" className="btn-dark" style=${{width:"100%"}} disabled=${busy}>${busy?"Signing in…":"Sign in"}</button>
      </form>
      ${err&&html`<p className="gate-err">${err}</p>`}
    </div>
  </div>`;
}

/* ---------- data store: Supabase when configured, in-memory example otherwise ---------- */
function useStore(){
  const empty={mode:"loading",contacts:[],collabs:[],deliverables:[],ideas:[],tasks:[],settings:DEFAULT_SETTINGS};
  const [st,setSt]=useState(empty);
  const ref=useRef(empty);
  const dirty=useRef(new Map());

  const update=useCallback(fn=>{const next=fn(ref.current);ref.current=next;setSt(next)},[]);

  useEffect(()=>{
    let alive=true;
    if(!SUPABASE_READY){
      const ex=JSON.parse(JSON.stringify(EXAMPLE));
      update(s=>({...s,...ex,mode:"local"}));
      return;
    }
    const channels=[];
    (async()=>{
      const results=await Promise.all(COLS.map(col=>supabase.from(col).select("*")));
      if(!alive)return;
      const failed=results.find(r=>r.error);
      if(failed){update(s=>({...s,mode:"offline",error:failed.error.message}));return}
      update(s=>{
        const n={...s};
        COLS.forEach((col,i)=>{n[col]=(results[i].data||[]).slice().sort(byCreated)});
        n.mode="live";
        return n;
      });
      const {data:setRow}=await supabase.from("settings").select("*").eq("id","main").maybeSingle();
      if(alive&&setRow)update(s=>({...s,settings:{...DEFAULT_SETTINGS,...setRow,rates:{...DEFAULT_SETTINGS.rates,...(setRow.rates||{})}}}));

      COLS.forEach(col=>{
        const ch=supabase.channel(col+"-changes").on("postgres_changes",{event:"*",schema:"public",table:col},payload=>{
          update(s=>{
            let list=s[col].slice();
            if(payload.eventType==="DELETE"){
              list=list.filter(x=>x.id!==payload.old.id);
            }else{
              const row=payload.new;
              if(dirty.current.has(col+"/"+row.id))return s;
              const idx=list.findIndex(x=>x.id===row.id);
              if(idx>=0)list[idx]=row;else list.push(row);
            }
            list.sort(byCreated);
            return {...s,[col]:list};
          });
        }).subscribe();
        channels.push(ch);
      });
      const sch=supabase.channel("settings-changes").on("postgres_changes",{event:"*",schema:"public",table:"settings",filter:"id=eq.main"},payload=>{
        if(dirty.current.has("settings/main"))return;
        const d=payload.new;
        if(d)update(s=>({...s,settings:{...DEFAULT_SETTINGS,...d,rates:{...DEFAULT_SETTINGS.rates,...(d.rates||{})}}}));
      }).subscribe();
      channels.push(sch);
    })();
    return()=>{alive=false;channels.forEach(c=>supabase.removeChannel(c))};
  },[]);

  const flush=key=>{
    const ent=dirty.current.get(key);
    if(!ent)return;
    if(ent.inflight){ent.again=true;return}
    const slash=key.indexOf("/");const col=key.slice(0,slash),id=key.slice(slash+1);
    const cur=col==="settings"?ref.current.settings:ref.current[col].find(x=>x.id===id);
    if(!cur){dirty.current.delete(key);return}
    const body=col==="settings"?{id:"main",...cur}:{...cur};
    ent.inflight=true;update(s=>({...s,saving:(s.saving||0)+1}));
    const attempt=n=>supabase.from(col).upsert(body).then(({error})=>{
      if(error){
        if(n<1)return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(()=>attempt(n+1));
        console.warn("write failed",key,error);update(s=>({...s,error:"Couldn't save a change. Check your connection and try again."}));
      }
    });
    attempt(0).finally(()=>{
      ent.inflight=false;update(s=>({...s,saving:Math.max(0,(s.saving||1)-1)}));
      if(ent.again){ent.again=false;flush(key);return}
      setTimeout(()=>{if(!ent.timer&&!ent.inflight&&!ent.again&&dirty.current.get(key)===ent)dirty.current.delete(key)},1500);
    });
  };
  const schedule=(key,delay)=>{
    if(!SUPABASE_READY)return;
    let ent=dirty.current.get(key);
    if(!ent){ent={timer:null,inflight:false,again:false};dirty.current.set(key,ent)}
    clearTimeout(ent.timer);
    ent.timer=setTimeout(()=>{ent.timer=null;flush(key)},delay);
  };

  const api={
    patch(col,id,fields,delay=450){
      update(s=>({...s,[col]:s[col].map(o=>o.id===id?{...o,...fields}:o)}));
      schedule(col+"/"+id,delay);
    },
    add(col,item){
      const it={createdAt:Date.now(),...item};
      update(s=>({...s,[col]:s[col].concat([it])}));
      schedule(col+"/"+it.id,0);
      return it;
    },
    remove(pairs){
      pairs.forEach(([col,id])=>{const k=col+"/"+id;const ent=dirty.current.get(k);if(ent)clearTimeout(ent.timer);dirty.current.delete(k)});
      update(s=>{const n={...s};pairs.forEach(([col,id])=>{n[col]=n[col].filter(o=>o.id!==id)});return n});
      if(SUPABASE_READY)pairs.forEach(([col,id])=>supabase.from(col).delete().eq("id",id).then(({error})=>{if(error)console.warn("delete failed",error)}));
    },
    settings(fields){
      update(s=>({...s,settings:{...s.settings,...fields}}));
      schedule("settings/main",500);
    },
    clearError(){update(s=>({...s,error:null}))}
  };
  return [st,api];
}
