    {k:"website",label:"Website",value:oc.website},
    {k:"social",label:"Social handle",value:oc.social},
    {k:"lastContactDate",label:"Last contacted",value:oc.lastContactDate,type:"date"},
    {k:"followUpDate",label:"Follow up again",value:oc.followUpDate,type:"date"},
    {k:"folder",label:"Folder link",value:oc.folder}
  ];

  return html`<div className="scrim panel-wrap" onClick=${onClose}>
    <div className="panel" onClick=${stop} role="dialog" aria-modal="true" aria-label=${oc.brand}>
      <div className="panel-head">
        <input id="cm-brand" aria-label="Brand" className="quiet" value=${oc.brand} onChange=${val(v=>api.patch("contacts",oc.id,{brand:v}))} style=${{flex:1,minWidth:0,fontSize:22,fontWeight:700,letterSpacing:"-.035em",borderRadius:8,padding:"2px 4px"}}/>
        <button type="button" className="nav-btn" style=${{width:28,height:28,borderRadius:8,fontSize:12}} aria-label="Close" onClick=${onClose}>✕</button>
      </div>
      <div className="panel-body" style=${{paddingTop:14,paddingBottom:40}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <select id="cm-status" aria-label="Relationship" value=${oc.status} onChange=${val(v=>api.patch("contacts",oc.id,{status:v},0))} style=${{border:0,borderRadius:8,background:"var(--ink)",color:"var(--surface)",padding:"7px 12px",fontSize:12.5,fontWeight:500}}><${Options} list=${CSTATUS}/></select>
          <button type="button" className="x" style=${{marginLeft:"auto",width:"auto",padding:"0 8px",fontSize:12}} onClick=${()=>askDelete("Delete "+oc.brand+"?",mine.length?"This contact has "+mine.length+(mine.length===1?" collaboration":" collaborations")+". They will be deleted too.":"The contact will be removed.",()=>{
            const ids=mine.map(x=>x.id);
            const dels=st.deliverables.filter(d=>ids.includes(d.collabId));
            api.remove([["contacts",oc.id],...ids.map(id=>["collabs",id]),...dels.flatMap(d=>[["deliverables",d.id],["tasks","cd-"+d.id]])]);
            onClose();
          })}>Delete</button>
        </div>

        <div className="fgrid">
          ${fields.map(f=>html`<label key=${f.k} style=${{display:"block",marginBottom:10,minWidth:0}}>
            <span className="kicker" style=${{display:"block",marginBottom:3}}>${f.label}</span>
            <input id=${"cm-"+f.k} className="field" type=${f.type||"text"} value=${f.value||""} onChange=${val(v=>api.patch("contacts",oc.id,{[f.k]:v},f.type==="date"?0:undefined))}/>
          </label>`)}
        </div>

        <div style=${{margin:"4px 0 20px"}}>
          <label htmlFor="cm-notes" className="kicker" style=${{display:"block",marginBottom:5}}>What they said · notes</label>
          <textarea id="cm-notes" className="field" rows="4" value=${oc.notes||""} onChange=${val(v=>api.patch("contacts",oc.id,{notes:v}))} placeholder="What they responded, context from the last call, anything worth remembering" style=${{borderRadius:11,padding:"9px 11px",lineHeight:1.55,resize:"vertical"}}></textarea>
        </div>

        <div>
          <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <h4 style=${{fontSize:16,fontWeight:600,margin:0,letterSpacing:"-.022em"}}>Connected deals</h4>
            <span style=${{fontSize:12,color:"var(--muted)"}}>${mine.length}</span>
            <button type="button" className="btn-dark" style=${{marginLeft:"auto",borderRadius:8,padding:"6px 14px",fontSize:12.5}} onClick=${()=>{onClose();newCollab("Potential",oc)}}>Start collab</button>
          </div>
          <div style=${{display:"flex",flexDirection:"column",gap:8}}>
            ${mine.length===0&&html`<div className="empty-drop">No collaborations yet</div>`}
            ${mine.map(c=>html`<div key=${c.id} className="del" style=${{cursor:"pointer"}} onClick=${()=>openCollab(c.id)}>
              <div style=${{display:"flex",alignItems:"center",gap:10}}>
                <span style=${{fontSize:13.5,fontWeight:500,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${c.brand}</span>
                <span className="num" style=${{fontSize:12.5,color:"var(--ink-2)"}}>${kr(dkk(c))}</span>
                <span style=${{fontSize:11.5,color:"var(--muted)"}}>${c.stage}</span>
                ${c.archived&&html`<span className="kicker">Archived</span>`}
              </div>
            </div>`)}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Collaboration panel ---------- */
function CollabPanel(p){
  const {collab:oc,st,api,dkk,onClose,askDelete}=p;
  const contact=st.contacts.find(c=>c.id===oc.contactId)||{};
  const pc=(key,delay)=>val(v=>api.patch("collabs",oc.id,{[key]:v},delay));
  const dels=st.deliverables.filter(d=>d.collabId===oc.id);
  const folderHref=oc.folder?(/^https?:\/\//.test(oc.folder)?oc.folder:"https://"+oc.folder.trim()):"";
  const siblings=st.collabs.filter(x=>x.contactId===contact.id).length;
  const fields=[
    {k:"person",label:"Contact person",value:contact.person,on:val(v=>contact.id&&api.patch("contacts",contact.id,{person:v}))},
    {k:"email",label:"Email",value:contact.email,on:val(v=>contact.id&&api.patch("contacts",contact.id,{email:v}))},
    {k:"followUpDate",label:"Follow-up date",value:contact.followUpDate,type:"date",on:val(v=>contact.id&&api.patch("contacts",contact.id,{followUpDate:v},0))},
    {k:"folder",label:"Folder link",value:oc.folder,on:pc("folder"),href:folderHref},
    {k:"contract",label:"Contract",value:oc.contract,on:pc("contract")},
    {k:"invoice",label:"Invoice information",value:oc.invoice,on:pc("invoice")}
  ];
  const cutLabel=oc.owner==="Steph"?"Steph's cut · 10%":"Owner";
  const tall={fontSize:18,fontWeight:600};

  return html`<div className="scrim panel-wrap" onClick=${onClose}>
    <div className="panel" onClick=${stop} role="dialog" aria-modal="true" aria-label=${oc.brand}>
      <div className="panel-head">
        <input id="m-brand" aria-label="Brand" className="quiet" value=${oc.brand} onChange=${val(v=>{
          api.patch("collabs",oc.id,{brand:v});
          if(contact.id&&siblings===1)api.patch("contacts",contact.id,{brand:v});
        })} style=${{flex:1,minWidth:0,fontSize:22,fontWeight:700,letterSpacing:"-.035em",borderRadius:8,padding:"2px 4px"}}/>
        ${oc.archived&&html`<span className="kicker" style=${{flex:"none"}}>Archived</span>`}
        <button type="button" className="nav-btn" style=${{width:28,height:28,borderRadius:8,fontSize:12}} aria-label="Close" onClick=${onClose}>✕</button>
      </div>
      <div className="panel-body" style=${{paddingTop:14,paddingBottom:40}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <select id="m-stage" aria-label="Stage" value=${oc.stage} onChange=${val(v=>p.setStage(oc,v))} style=${{border:0,borderRadius:8,background:"var(--ink)",color:"var(--surface)",padding:"7px 12px",fontSize:12.5,fontWeight:500}}><${Options} list=${STAGES}/></select>
          <select id="m-kanban" aria-label="Board column" className="psel" value=${oc.kanban} onChange=${val(v=>p.setKanban(oc,v))}><${Options} list=${KAN}/></select>
          <select id="m-fin" aria-label="Financial status" className="psel" value=${oc.finStatus} onChange=${pc("finStatus",0)}><${Options} list=${FIN}/></select>
          <select id="m-owner" aria-label="Owner" className="psel" value=${oc.owner} onChange=${pc("owner",0)}><${Options} list=${OWNERS}/></select>
          <select id="m-contact" aria-label="Brand contact" className="psel" value=${oc.contactId} onChange=${val(v=>api.patch("collabs",oc.id,{contactId:v},0))} title="Linked contact">
            ${st.contacts.slice().sort((a,b)=>(a.brand||"").localeCompare(b.brand||"")).map(c=>html`<option key=${c.id} value=${c.id}>Contact: ${c.brand}${c.person?" · "+c.person:""}</option>`)}
          </select>
          <button type="button" className="btn" style=${{marginLeft:"auto",padding:"6px 12px",fontSize:12}} onClick=${()=>api.patch("collabs",oc.id,{archived:!oc.archived},0)}>${oc.archived?"Unarchive":"Archive"}</button>
          <button type="button" className="x" style=${{width:"auto",padding:"0 8px",fontSize:12}} onClick=${()=>p.deleteCollab(oc)}>Delete</button>
        </div>

        <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginBottom:14}}>
          <div className="stat" style=${{padding:"10px 13px"}}>
            <span className="kicker" style=${{display:"block",marginBottom:5}}>Price</span>
            <span style=${{display:"flex",alignItems:"baseline",gap:6}}>
              <input id="m-price" type="number" aria-label="Price" className="num" value=${oc.price} onChange=${val(v=>api.patch("collabs",oc.id,{price:Number(v)||0}))} style=${{...tall,width:100,background:"transparent",border:0,padding:0}}/>
              <select id="m-cur" aria-label="Currency" value=${oc.currency} onChange=${pc("currency",0)} style=${{border:0,background:"transparent",fontSize:12,color:"var(--ink-2)"}}><${Options} list=${CURRENCIES}/></select>
            </span>
          </div>
          <div className="stat" style=${{padding:"10px 13px"}}><span className="kicker" style=${{display:"block",marginBottom:5}}>In DKK</span><span className="num" style=${tall}>${kr(dkk(oc))}</span></div>
          <div className="stat" style=${{padding:"10px 13px"}}><span className="kicker" style=${{display:"block",marginBottom:5}}>${cutLabel}</span><span className="num" style=${tall}>${oc.owner==="Steph"?kr(dkk(oc)*STEPH_CUT):"Aleksandra"}</span></div>
        </div>

        <div className="fgrid">
          ${fields.map(f=>html`<label key=${f.k} style=${{display:"block",marginBottom:10,minWidth:0}}>
            <span style=${{display:"flex",alignItems:"baseline",gap:8,marginBottom:3}}>
              <span className="kicker">${f.label}</span>
              ${f.href&&html`<a href=${f.href} target="_blank" rel="noopener" onClick=${stop} style=${{fontSize:11}}>Open</a>`}
            </span>
            <input id=${"m-"+f.k} className="field" type=${f.type||"text"} value=${f.value||""} onChange=${f.on}/>
          </label>`)}
        </div>

        <div style=${{margin:"4px 0 16px"}}>
          <label htmlFor="m-pitch" className="kicker" style=${{display:"block",marginBottom:5}}>Content pitch</label>
          <textarea id="m-pitch" className="field" rows="2" value=${oc.pitch} onChange=${pc("pitch")} style=${{borderRadius:11,padding:"9px 11px",lineHeight:1.5,resize:"vertical"}}></textarea>
          <label htmlFor="m-notes" className="kicker" style=${{display:"block",margin:"10px 0 5px"}}>Notes</label>
          <textarea id="m-notes" className="field" rows="3" value=${oc.notes} onChange=${pc("notes")} style=${{borderRadius:11,padding:"9px 11px",lineHeight:1.55,resize:"vertical"}}></textarea>
        </div>

        <div>
          <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <h4 style=${{fontSize:16,fontWeight:600,margin:0,letterSpacing:"-.022em"}}>Deliverables</h4>
            <span style=${{fontSize:12,color:"var(--muted)"}}>${dels.length} total · ${dels.filter(d=>d.publishDate).length} scheduled</span>
            <button type="button" className="btn-dark" style=${{marginLeft:"auto",borderRadius:8,padding:"6px 14px",fontSize:12.5}}
              onClick=${()=>api.add("deliverables",{id:uid("d"),collabId:oc.id,name:"New deliverable",platform:"Instagram",type:"Reel",status:"Idea",shootDate:"",editDeadline:"",publishDate:"",notes:"",link:""})}>Add</button>
          </div>
          <div style=${{display:"flex",flexDirection:"column",gap:10}}>
            ${dels.length===0&&html`<div className="empty-drop">No deliverables yet</div>`}
            ${dels.map(d=>html`<div key=${d.id} className="del">
              <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
                <input id=${"dn-"+d.id} aria-label="Deliverable name" className="quiet quiet-w" value=${d.name} onChange=${val(v=>api.patch("deliverables",d.id,{name:v}))} style=${{flex:"1 1 160px",minWidth:0,fontSize:13.5,fontWeight:500,padding:"2px 4px"}}/>
                <select id=${"dp-"+d.id} aria-label="Platform" value=${d.platform} onChange=${val(v=>api.patch("deliverables",d.id,{platform:v},0))} style=${{border:0,borderRadius:8,background:"var(--surface)",padding:"4px 9px",fontSize:11.5}}><${Options} list=${PLATFORMS}/></select>
                <select id=${"ds-"+d.id} aria-label="Status" value=${d.status} onChange=${val(v=>api.patch("deliverables",d.id,{status:v},0))}
                  style=${{border:0,borderRadius:8,padding:"4px 10px",fontSize:11.5,background:d.status==="Published"?"var(--surface)":"var(--ink)",color:d.status==="Published"?"var(--muted)":"var(--surface)"}}><${Options} list=${DSTATUS}/></select>
                <button type="button" className="x" style=${{color:"var(--faint)"}} aria-label="Delete deliverable" onClick=${()=>askDelete("Delete this deliverable?","“"+d.name+"” will be removed from "+oc.brand+" and from the calendar.",()=>api.remove([["deliverables",d.id],["tasks","cd-"+d.id]]))}>✕</button>
              </div>
              <div style=${{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:10}}>
                ${[["shootDate","Shoot"],["editDeadline","Edit by"],["publishDate","Publish"]].map(([k,l])=>html`<label key=${k} style=${{display:"block",minWidth:0}}>
                  <span style=${{display:"block",fontSize:10,fontWeight:500,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>${l}</span>
                  <input id=${"d"+k+"-"+d.id} type="date" className="del-date num" value=${d[k]||""} onChange=${val(v=>api.patch("deliverables",d.id,k==="publishDate"?{publishDate:v,status:v&&d.status==="Idea"?"Scheduled":d.status}:{[k]:v},0))}/>
                </label>`)}
              </div>
            </div>`)}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
