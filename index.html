<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f5f5; --surface:#fff; --line:#e6e6e6; --line-2:#ededed; --line-3:#e0e0e0;
  --dash:#d4d4d4; --dash-2:#c4c4c4; --ink:#000; --ink-2:#6b6b6b; --muted:#9a9a9a; --faint:#b0b0b0;
  --fill:#f2f2f2; --hot:#ececec; --cell:#fafafa; --knob-on:#333; --scrim:rgba(0,0,0,.26);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
a:hover{color:var(--ink-2)}
::selection{background:var(--line)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.kicker{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--dash-2);font-size:12px;line-height:1;padding:0}
.x:hover{background:var(--bg);color:var(--ink)}
.quiet{background:transparent;border:0;border-radius:6px;padding:1px 4px;margin-left:-4px}
.quiet:hover{background:var(--bg)}
.qsel{border:0;background:transparent;padding:0;font-size:12.5px;max-width:100%;cursor:pointer}
.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 16px;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn-dark{border:0;border-radius:9px;background:var(--ink);color:var(--surface);padding:8px 18px;font-size:13px;font-weight:500;white-space:nowrap}
.btn-dark:hover{background:var(--knob-on)}
.btn-dark:disabled{opacity:.5;cursor:default}
.pills{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto}
.pill{border:0;border-radius:999px;white-space:nowrap;padding:8px 17px;font-size:13px;font-weight:500;background:transparent;color:var(--muted)}
.pill.on{background:var(--ink);color:var(--surface)}
.field{width:100%;background:var(--bg);border:1px solid transparent;border-radius:9px;padding:8px 10px;font-size:13px}
.field:focus{border-color:var(--ink);outline:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:16px 28px 0}
.hdr-row{display:flex;align-items:center;gap:26px;padding-bottom:14px;border-bottom:1px solid var(--line-3);flex-wrap:wrap;row-gap:10px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.035em}
.tabs{display:flex;gap:22px}
.tab{border:0;background:transparent;padding:3px 0;font-size:15px;font-weight:500;letter-spacing:-.015em;border-bottom:2px solid transparent;color:var(--muted)}
.tab.on{border-bottom-color:var(--ink);color:var(--ink)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.toggle{display:flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);color:var(--ink-2);padding:5px 12px 5px 5px;font-size:12px}
.toggle.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.knob{display:flex;width:26px;height:15px;border-radius:999px;padding:2px;background:var(--line);justify-content:flex-start}
.toggle.on .knob{background:var(--knob-on);justify-content:flex-end}
.knob span{width:11px;height:11px;border-radius:50%;background:#fff}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);padding:4px 12px 4px 4px}
.acct:hover{border-color:var(--ink)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600}
.sync{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* dashboard */
.page{padding:26px 28px 60px;max-width:1640px}
.title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:18px 20px}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.02;margin-top:14px}
.kpi-delta{font-size:12.5px;font-weight:500;margin-top:3px}
.kpi-sub{font-size:12px;color:var(--ink-2);margin-top:10px}
.chart-row{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:12px;margin-bottom:24px}
.chart-card{padding:18px 22px 10px;min-width:0}
.goal-card{padding:18px 20px;display:flex;flex-direction:column;align-items:center}
.goal-input{width:78px;text-align:right;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 3px;font-size:12.5px;color:var(--ink-2)}
.goal-input:hover{background:var(--bg)}
.goal-input:focus{border-color:var(--ink);outline:none}

.todo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px 28px;margin-bottom:26px}
.todo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;row-gap:28px}
.task{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.check{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0}
.check.done{background:var(--ink)}
.add-row{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:4px 0;background:transparent;border:0;font-size:13px;color:var(--muted)}
.add-row:hover{color:var(--ink)}
.add-dot{width:22px;height:22px;border:1px dashed var(--dash-2);border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{border-radius:16px;padding:8px 6px 16px;min-height:180px}
.col.hot{background:var(--hot)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer}
.kcard:hover{border-color:var(--ink)}
.clamp{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-drop{border:1px dashed var(--dash);border-radius:14px;padding:22px;text-align:center;font-size:12px;color:var(--faint)}
.add-collab{border:1px dashed var(--dash);border-radius:14px;padding:11px;background:transparent;font-size:12.5px;color:var(--muted)}
.add-collab:hover{border-color:var(--ink);color:var(--ink)}

/* calendar */
.cal-wrap{display:flex;align-items:stretch;gap:12px;padding:24px 28px 44px}
.cal-main{flex:1;min-width:0}
.nav-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;padding:0}
.nav-btn:hover{border-color:var(--ink)}
.grid-scroll{overflow-x:auto}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:620px}
.cell{border-radius:10px;padding:8px;cursor:pointer;background:var(--cell)}
.cell.hot{background:var(--hot)}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px;cursor:grab;min-width:0}
.chip.idea{border:1px dashed var(--dash-2)}
.chip:hover{border-color:var(--ink)}
.chip-t{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row{display:grid;grid-template-columns:128px minmax(0,2fr) minmax(0,1fr) 106px;gap:16px;align-items:center;padding:13px 8px;border-bottom:1px solid var(--line-2);border-radius:9px;cursor:pointer}
.list-row:hover{background:var(--bg)}
.side{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.side.hot{background:var(--hot)}
.uns{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:9px 11px;cursor:grab}
.uns:hover{border-color:var(--ink)}
.uns-idea{border:1px dashed var(--dash);border-radius:10px;padding:8px 9px;cursor:grab}
.uns-idea:hover{border-style:solid;border-color:var(--ink)}
.quiet-w:hover{background:var(--surface)}

/* contacts */
.ctable{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 20px 14px;overflow-x:auto}
.crow{display:grid;grid-template-columns:minmax(124px,1fr) minmax(110px,.8fr) minmax(150px,.9fr) 118px 78px 118px 118px 24px;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line-2);border-radius:9px;align-items:center;min-width:900px}
.crow.head{padding:14px 8px 10px;border-bottom-color:var(--line);border-radius:0}
.crow:not(.head):hover{background:var(--cell)}
.cin{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:7px;padding:3px 5px;margin-left:-5px;text-overflow:ellipsis}
.cin:hover{background:var(--surface);border-color:var(--line)}
.cin:focus{border-color:var(--ink);outline:none;background:var(--surface)}
.date-in{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 6px;font-size:12px;color:var(--ink-2)}
.date-in:hover{border-color:var(--line);background:var(--surface)}
.date-in:focus{border-color:var(--ink);outline:none}
.due{background:var(--ink);border-radius:8px}
.due .date-in{color:var(--surface);font-weight:500;color-scheme:dark}
.due .date-in:hover{background:transparent;border-color:var(--ink-2)}
.sel-box{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 10px;font-size:12.5px}

/* overlays */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.panel-wrap{display:flex;justify-content:flex-end;padding:12px}
.panel{width:min(640px,100%);height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.panel-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:20px 26px 14px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.panel-body{padding:18px 26px 56px}
.psel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 11px;font-size:12.5px;max-width:100%}
.stat{background:var(--bg);border-radius:12px;padding:13px 15px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.del{background:var(--bg);border-radius:12px;padding:12px 14px}
.del-date{width:100%;background:var(--surface);border:1px solid transparent;border-radius:8px;padding:5px 8px;font-size:11.5px}
.del-date:focus{border-color:var(--ink);outline:none}
.center{display:grid;place-items:center;padding:20px;z-index:60}
.dialog{width:min(380px,100%);background:var(--surface);border-radius:16px;padding:24px 26px 20px}
.dialog h4{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.022em}

/* auth gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding:20px}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px}
.gate-card h1{font-size:22px;margin-bottom:6px}
.gate-card p{font-size:13px;color:var(--ink-2);margin:0 0 20px;line-height:1.5}
.gate-msg{font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.5}
.gate-err{font-size:12.5px;color:#b3261e;margin-top:14px;line-height:1.5}

@media (max-width: 980px){
  .chart-row{grid-template-columns:minmax(0,1fr)}
  .cal-wrap{flex-direction:column}
  .side{width:100% !important}
}
@media (max-width: 760px){
  .hdr{padding:12px 16px 0}
  .hdr-row{gap:14px}
  .hdr-right{margin-left:0;width:100%;justify-content:flex-end;flex-wrap:wrap;gap:8px 10px}
  .today-lbl,.sync{display:none}
  .page,.cal-wrap{padding:20px 16px 48px}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .todo{padding:20px 18px}
  .ctable{padding:4px 12px 12px}
  .panel-wrap{padding:0}
  .panel{border-radius:0}
  .panel-head,.panel-body{padding-left:18px;padding-right:18px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .list-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .list-row .lr-meta{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- auth: real Supabase login shared by the whole team ---------- */
function useAuth(){
  const [state,setState]=useState({loading:SUPABASE_READY,session:null});
  useEffect(()=>{
    if(!SUPABASE_READY){setState({loading:false,session:null});return}
    let alive=true;
    supabase.auth.getSession()
      .then(({data})=>{if(alive)setState({loading:false,session:data.session})})
      .catch(err=>{console.warn("getSession failed",err);if(alive)setState({loading:false,session:null})});
    const {data:sub}=supabase.auth.onAuthStateChange((_event,session)=>{if(alive)setState({loading:false,session})});
    return()=>{alive=false;sub.subscription.unsubscribe()};
  },[]);
  return state;
}

function LoginGate(){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const submit=async e=>{
    e.preventDefault();
    const v=email.trim();
    if(!v||!password)return;
    setBusy(true);setErr("");
    const {error}=await supabase.auth.signInWithPassword({email:v,password});
    setBusy(false);
    if(error)setErr(error.message);
  };
  return html`<div className="gate">
    <div className="gate-card">
      <h1>Collabs</h1>
      <p>Sign in with your team account to see and edit the shared board. New teammate? Ask whoever set this up to add your account in Supabase.</p>
      <form onSubmit=${submit}>
        <label style=${{display:"block",marginBottom:14}}>
          <span className="kicker" style=${{display:"block",marginBottom:5}}>Email</span>
          <input id="login-email" className="field" type="email" autoFocus required value=${email} onChange=${val(setEmail)} placeholder="you@byggeligt.com"/>
        </label>
        <label style=${{display:"block",marginBottom:14}}>
          <span className="kicker" style=${{display:"block",marginBottom:5}}>Password</span>
          <input id="login-password" className="field" type="password" required value=${password} onChange=${val(setPassword)} placeholder="••••••••"/>
        </label>
        <button type="submit" className="btn-dark" style=${{width:"100%"}} disabled=${busy}>${busy?"Signing in…":"Sign in"}</button>
      </form>
      ${err&&html`<p className="gate-err">${err}</p>`}
    </div>
  </div>`;
}

/* ---------- data store: Supabase when configured, in-memory example otherwise ---------- */
function useStore(){
  const empty={mode:"loading",contacts:[],collabs:[],deliverables:[],ideas:[],tasks:[],settings:DEFAULT_SETTINGS};
  const [st,setSt]=useState(empty);
  const ref=useRef(empty);
  const dirty=useRef(new Map());

  const update=useCallback(fn=>{const next=fn(ref.current);ref.current=next;setSt(next)},[]);

  useEffect(()=>{
    let alive=true;
    if(!SUPABASE_READY){
      const ex=JSON.parse(JSON.stringify(EXAMPLE));
      update(s=>({...s,...ex,mode:"local"}));
      return;
    }
    const channels=[];
    (async()=>{
      const results=await Promise.all(COLS.map(col=>supabase.from(col).select("*")));
      if(!alive)return;
      const failed=results.find(r=>r.error);
      if(failed){update(s=>({...s,mode:"offline",error:failed.error.message}));return}
      update(s=>{
        const n={...s};
        COLS.forEach((col,i)=>{n[col]=(results[i].data||[]).slice().sort(byCreated)});
        n.mode="live";
        return n;
      });
      const {data:setRow}=await supabase.from("settings").select("*").eq("id","main").maybeSingle();
      if(alive&&setRow)update(s=>({...s,settings:{...DEFAULT_SETTINGS,...setRow,rates:{...DEFAULT_SETTINGS.rates,...(setRow.rates||{})}}}));

      COLS.forEach(col=>{
        const ch=supabase.channel(col+"-changes").on("postgres_changes",{event:"*",schema:"public",table:col},payload=>{
          update(s=>{
            let list=s[col].slice();
            if(payload.eventType==="DELETE"){
              list=list.filter(x=>x.id!==payload.old.id);
            }else{
              const row=payload.new;
              if(dirty.current.has(col+"/"+row.id))return s;
              const idx=list.findIndex(x=>x.id===row.id);
              if(idx>=0)list[idx]=row;else list.push(row);
            }
            list.sort(byCreated);
            return {...s,[col]:list};
          });
        }).subscribe();
        channels.push(ch);
      });
      const sch=supabase.channel("settings-changes").on("postgres_changes",{event:"*",schema:"public",table:"settings",filter:"id=eq.main"},payload=>{
        if(dirty.current.has("settings/main"))return;
        const d=payload.new;
        if(d)update(s=>({...s,settings:{...DEFAULT_SETTINGS,...d,rates:{...DEFAULT_SETTINGS.rates,...(d.rates||{})}}}));
      }).subscribe();
      channels.push(sch);
    })();
    return()=>{alive=false;channels.forEach(c=>supabase.removeChannel(c))};
  },[]);

  const flush=key=>{
    const ent=dirty.current.get(key);
    if(!ent)return;
    if(ent.inflight){ent.again=true;return}
    const slash=key.indexOf("/");const col=key.slice(0,slash),id=key.slice(slash+1);
    const cur=col==="settings"?ref.current.settings:ref.current[col].find(x=>x.id===id);
    if(!cur){dirty.current.delete(key);return}
    const body=col==="settings"?{id:"main",...cur}:{...cur};
    ent.inflight=true;update(s=>({...s,saving:(s.saving||0)+1}));
    const attempt=n=>supabase.from(col).upsert(body).then(({error})=>{
      if(error){
        if(n<1)return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(()=>attempt(n+1));
        console.warn("write failed",key,error);update(s=>({...s,error:"Couldn't save a change. Check your connection and try again."}));
      }
    });
    attempt(0).finally(()=>{
      ent.inflight=false;update(s=>({...s,saving:Math.max(0,(s.saving||1)-1)}));
      if(ent.again){ent.again=false;flush(key);return}
      setTimeout(()=>{if(!ent.timer&&!ent.inflight&&!ent.again&&dirty.current.get(key)===ent)dirty.current.delete(key)},1500);
    });
  };
  const schedule=(key,delay)=>{
    if(!SUPABASE_READY)return;
    let ent=dirty.current.get(key);
    if(!ent){ent={timer:null,inflight:false,again:false};dirty.current.set(key,ent)}
    clearTimeout(ent.timer);
    ent.timer=setTimeout(()=>{ent.timer=null;flush(key)},delay);
  };

  const api={
    patch(col,id,fields,delay=450){
      update(s=>({...s,[col]:s[col].map(o=>o.id===id?{...o,...fields}:o)}));
      schedule(col+"/"+id,delay);
    },
    add(col,item){
      const it={createdAt:Date.now(),...item};
      update(s=>({...s,[col]:s[col].concat([it])}));
      schedule(col+"/"+it.id,0);
      return it;
    },
    remove(pairs){
      pairs.forEach(([col,id])=>{const k=col+"/"+id;const ent=dirty.current.get(k);if(ent)clearTimeout(ent.timer);dirty.current.delete(k)});
      update(s=>{const n={...s};pairs.forEach(([col,id])=>{n[col]=n[col].filter(o=>o.id!==id)});return n});
      if(SUPABASE_READY)pairs.forEach(([col,id])=>supabase.from(col).delete().eq("id",id).then(({error})=>{if(error)console.warn("delete failed",error)}));
    },
    settings(fields){
      update(s=>({...s,settings:{...s.settings,...fields}}));
      schedule("settings/main",500);
    },
    clearError(){update(s=>({...s,error:null}))}
  };
  return [st,api];
}

  // "cd-<id>" ids mean two clients racing to sync converge on the same row
  // instead of creating duplicates. Must run unconditionally (before the
  // early returns below) so hook order stays identical on every render.
  useEffect(()=>{
    st.deliverables.forEach(d=>{
      const taskId="cd-"+d.id;
      const existing=st.tasks.find(x=>x.id===taskId);
      const c=st.collabs.find(x=>x.id===d.collabId);
      const title=(c?c.brand:"")+" — "+d.name;
      const meta=d.platform+" · "+d.type+(d.publishDate?" · publishes "+fmtDate(d.publishDate):"");
      const shouldBeDone=d.status==="Published";
      if(!existing){
        if(!shouldBeDone)api.add("tasks",{id:taskId,group:"Content",title,meta,done:false,collabId:d.collabId,createdAt:0});
      }else if(existing.done!==shouldBeDone||existing.title!==title||existing.meta!==meta){
        api.patch("tasks",taskId,{done:shouldBeDone,title,meta},0);
      }
    });
  },[st.deliverables]);

  if(SUPABASE_READY&&auth.loading)return html`<div className="gate"><span className="kicker">Loading…</span></div>`;

  const rates=settings.rates||DEFAULT_SETTINGS.rates;

  const t=parse(TODAY);
  const prev=new Date(t.getFullYear(),t.getMonth()-1,1);
  const next=new Date(t.getFullYear(),t.getMonth()+1,1);
  const monthPick=/^(\d{4})-(\d{2})$/.exec(period);
  const inPeriod=iso=>{
    if(period==="All time")return true;
    const d=parse(iso)||t;
    if(monthPick)return d.getFullYear()===Number(monthPick[1])&&d.getMonth()===Number(monthPick[2])-1;
    if(period==="This year")return d.getFullYear()===t.getFullYear();
    if(period==="This month")return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth();
    if(period==="Next month")return d.getFullYear()===next.getFullYear()&&d.getMonth()===next.getMonth();
    return d.getFullYear()===prev.getFullYear()&&d.getMonth()===prev.getMonth();
  };
  const monthRevenue=(y,m,statuses)=>collabs.filter(c=>{const d=parse(collabDate(c));return d&&d.getFullYear()===y&&d.getMonth()===m&&statuses.includes(c.finStatus)}).reduce((a,c)=>a+dkk(c),0);

  const askDelete=(title,detail,onYes)=>setConfirm({title,detail,onYes});
  const startDrag=(kind,id)=>e=>{drag.current={kind,id};if(e.dataTransfer){e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",id)}catch(err){}}};
  const endDrag=()=>{drag.current=null;setDropTarget(null)};
  const allowDrop=target=>e=>{e.preventDefault();if(dropTarget!==target)setDropTarget(target)};
  const leaveDrop=target=>e=>{if(!e.currentTarget.contains(e.relatedTarget)&&dropTarget===target)setDropTarget(null)};

  const deleteCollab=c=>{
    const dels=deliverables.filter(d=>d.collabId===c.id);
    askDelete("Delete "+c.brand+"?","The collaboration and its "+dels.length+(dels.length===1?" deliverable go":" deliverables go")+" with it. The contact stays in Contacts.",()=>{
      api.remove([["collabs",c.id],...dels.flatMap(d=>[["deliverables",d.id],["tasks","cd-"+d.id]])]);
      if(open===c.id)setOpen(null);
    });
  };
  const newCollab=(kanban,contact)=>{
    let ct=contact;
    if(!ct)ct=api.add("contacts",{id:uid("c"),brand:"New brand",person:"",email:"",website:"",social:"",folder:"",lastContactDate:TODAY,followUpDate:"",status:"Responded"});
    const c=api.add("collabs",{id:uid("k"),contactId:ct.id,brand:ct.brand,owner:"Aleksandra",price:0,currency:"DKK",finStatus:kanban==="Potential"?"Potential":"Booked",stage:kanban==="Completed"?"Done":kanban==="Ongoing"?"Order products":"Need to respond",kanban:kanban||"Potential",pitch:"",notes:"",folder:"",contract:"",startDate:"",endDate:"",invoice:""});
    setTab("dash");setOpen(c.id);
  };
  const setStage=(c,stage)=>{
    api.patch("collabs",c.id,{stage},0);
    if(stage==="Send invoice"){
      const taskId="inv-"+c.id;
      if(!tasks.some(x=>x.id===taskId))api.add("tasks",{id:taskId,group:"Finance",title:"Send "+c.brand+" invoice",meta:kr(dkk(c))+" · ready to invoice",done:false,collabId:c.id,createdAt:0});
    }
  };

  const common={st,api,dkk,brandOf,collabDate,startDrag,endDrag,allowDrop,leaveDrop,dropTarget,setDropTarget,drag,askDelete,setOpen,setTab,deleteCollab,newCollab,setStage};

  const sync = st.mode==="loading"?"Loading…":st.mode==="local"?"Example data · not saved":st.mode==="offline"?"Read-only":(st.saving?"Saving…":"Saved");

  return html`
  <div>
    <header className="hdr">
      <div className="hdr-row">
        <span className="brand">Collabs</span>
        <nav className="tabs">
          ${[["dash","Dashboard"],["cal","Calendar"],["contacts","Contacts"]].map(([k,l])=>html`<button key=${k} type="button" className=${"tab"+(tab===k?" on":"")} onClick=${()=>setTab(k)}>${l}</button>`)}
        </nav>
        <div className="hdr-right">
          <div style=${{display:"flex",gap:4}}>
            <${Toggle} label="Finance" on=${showFinance} onClick=${()=>setShowFinance(!showFinance)}/>
            <${Toggle} label="To do" on=${showToday} onClick=${()=>setShowToday(!showToday)}/>
          </div>
          <span className="sync" aria-live="polite">${sync}</span>
          <span className="today-lbl num" style=${{fontSize:13,color:"var(--muted)"}}>${t.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</span>
          <button type="button" className="acct" onClick=${()=>setLogin(true)} title=${SUPABASE_READY?"Account":"Your label on this device"}>
            <span className="avatar">${(email||"?").slice(0,2).toUpperCase()}</span>
            <span style=${{fontSize:12.5,fontWeight:500}}>${(email||"").split("@")[0]}</span>
          </button>
        </div>
      </div>
      ${st.error&&html`<div style=${{display:"flex",gap:10,alignItems:"center",padding:"8px 0",fontSize:12.5}}>
        <span>${st.error}</span><button type="button" className="x" onClick=${api.clearError} aria-label="Dismiss">✕</button></div>`}
    </header>

    ${tab==="dash"&&html`<${Dashboard} ...${common} period=${period} setPeriod=${setPeriod} showFinance=${showFinance} showToday=${showToday}
        goal=${goal} inPeriod=${inPeriod} monthRevenue=${monthRevenue} t=${t} prev=${prev} next=${next}/>`}
    ${tab==="cal"&&html`<${Calendar} ...${common} calMode=${calMode} setCalMode=${setCalMode} cursor=${cursor} setCursor=${setCursor}
        sidebar=${sidebar} setSidebar=${setSidebar} openQuick=${iso=>{setQuick(iso);setQuickTitle("")}}/>`}
    ${tab==="contacts"&&html`<${Contacts} ...${common} cFilter=${cFilter} setCFilter=${setCFilter} cSort=${cSort} setCSort=${setCSort}/>`}

    ${open&&collabs.find(c=>c.id===open)&&html`<${CollabPanel} ...${common} collab=${collabs.find(c=>c.id===open)} onClose=${()=>setOpen(null)}/>`}

    ${quick&&html`<div className="scrim center" onClick=${()=>setQuick(null)}>
      <div className="dialog" onClick=${stop} role="dialog" aria-modal="true" aria-labelledby="qa-t">
        <h4 id="qa-t">Add event</h4>
        <p style=${{fontSize:12.5,color:"var(--muted)",margin:"0 0 16px"}}>${parse(quick).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</p>
        <form onSubmit=${e=>{e.preventDefault();const title=quickTitle.trim();if(title)api.add("ideas",{id:uid("i"),title,hook:"",concept:"",platform:"Instagram",type:"Reel",collabId:"",scheduledDate:quick});setQuick(null)}}>
          <label style=${{display:"block",marginBottom:18}}>
            <span className="kicker" style=${{display:"block",marginBottom:5}}>Title</span>
            <input id="quick-title" className="field" autoFocus value=${quickTitle} onChange=${val(setQuickTitle)} placeholder="e.g. Hallway before and after"/>
          </label>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button type="button" className="btn" onClick=${()=>setQuick(null)}>Cancel</button>
            <button type="submit" className="btn-dark">💡 Add idea</button>
          </div>
        </form>
      </div></div>`}

    ${login&&html`<div className="scrim center" onClick=${()=>setLogin(false)}>
      <div className="dialog" onClick=${stop} role="dialog" aria-modal="true" aria-labelledby="lg-t" aria-describedby="lg-d">
        <h4 id="lg-t">${SUPABASE_READY?"Your account":"Your label on this device"}</h4>
        ${SUPABASE_READY?html`
          <p id="lg-d" style=${{fontSize:12.5,color:"var(--muted)",margin:"0 0 20px",lineHeight:1.5}}>Signed in as <strong>${email}</strong>. Sign out to switch accounts on this device.</p>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button type="button" className="btn" onClick=${()=>setLogin(false)}>Close</button>
            <button type="button" className="btn-dark" onClick=${async()=>{await supabase.auth.signOut();setLogin(false)}}>Sign out</button>
          </div>
        `:html`
          <p id="lg-d" style=${{fontSize:12.5,color:"var(--muted)",margin:"0 0 20px",lineHeight:1.5}}>This is example data running without a database — see the project README to connect Supabase so changes save for the whole team.</p>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button type="button" className="btn" onClick=${()=>setLogin(false)}>Close</button>
          </div>
        `}
      </div></div>`}

    ${confirm&&html`<div className="scrim center" onClick=${()=>setConfirm(null)}>
      <div className="dialog" style=${{width:"min(400px,100%)"}} onClick=${stop} role="alertdialog" aria-modal="true" aria-labelledby="cf-t">
        <h4 id="cf-t" style=${{marginBottom:6}}>${confirm.title}</h4>
        <p style=${{fontSize:13.5,color:"var(--ink-2)",margin:"0 0 20px"}}>${confirm.detail}</p>
        <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button type="button" className="btn" onClick=${()=>setConfirm(null)}>Cancel</button>
          <button type="button" className="btn-dark" autoFocus onClick=${()=>{const c=confirm;setConfirm(null);c.onYes()}}>Delete</button>
        </div>
      </div></div>`}
  </div>`;
}

/* ---------- Dashboard ---------- */
function Dashboard(p){
  const {st,api,dkk,collabDate,period,setPeriod,showFinance,showToday,goal,inPeriod,monthRevenue,t,prev,next,setOpen,askDelete}=p;
  const {collabs,deliverables,tasks}=st;
  // KPI math stays on a single date per collab (matches monthRevenue) so a
  // collab is never counted toward more than one period's revenue at once.
  const scoped=collabs.filter(c=>inPeriod(collabDate(c)));
  // The board is a look-ahead view, not an accounting one: a collab with
  // deliverables spanning two months should show up under both.
  const boardScoped=collabs.filter(c=>{
    const dates=deliverables.filter(d=>d.collabId===c.id&&d.publishDate).map(d=>d.publishDate);
    const candidates=dates.length?dates:[collabDate(c)];
    return candidates.some(inPeriod);
  });
  const won=scoped.filter(c=>c.finStatus!=="Potential");
  const secured=won.reduce((a,c)=>a+dkk(c),0);
  const monthsLeft=12-t.getMonth();
  const yearGoal=goal*monthsLeft;
  const effectiveGoal=period==="This year"?yearGoal:goal;
  const pct=effectiveGoal>0?Math.round(secured/effectiveGoal*100):0;
  const stephList=scoped.filter(c=>c.owner==="Steph");
  const stephCut=stephList.reduce((a,c)=>a+dkk(c),0)*STEPH_CUT;
  const thisMonth=monthRevenue(t.getFullYear(),t.getMonth(),["Paid","Invoiced"]);
  const lastMonth=monthRevenue(prev.getFullYear(),prev.getMonth(),["Paid","Invoiced"]);
  const mom=lastMonth>0?Math.round((thisMonth-lastMonth)/lastMonth*100):null;
  const avg=won.length?Math.round(secured/won.length):0;
  const monthPick=/^(\d{4})-(\d{2})$/.exec(period);
  const titleMap={"This month":MONTHS[t.getMonth()]+" performance","Last month":MONTHS[prev.getMonth()]+" performance","Next month":MONTHS[next.getMonth()]+" performance","This year":t.getFullYear()+" performance","All time":"All-time performance"};
  const pageTitle=monthPick?MONTHS[Number(monthPick[2])-1]+" "+monthPick[1]+" performance":(titleMap[period]||"Performance");

  const kpis=[
    {label:"Revenue this month",value:kr(thisMonth),delta:mom===null?"No comparison":(mom>=0?"+":"")+mom+"% vs "+MONTHS[prev.getMonth()],dc:mom!==null&&mom<0?"var(--muted)":"var(--ink)",
      sub:kr(monthRevenue(t.getFullYear(),t.getMonth(),["Booked"]))+" booked · "+kr(monthRevenue(t.getFullYear(),t.getMonth(),["Invoiced"]))+" invoiced"},
    {label:"Average collab value",value:kr(avg),delta:won.length+" won collabs",dc:"var(--ink-2)",sub:"Across the selected period"},
    {label:"Steph's cut",value:kr(stephCut),delta:stephList.length+" collabs",dc:"var(--ink-2)",sub:"10% of Steph's collabs"}
  ];

  // chart
  const months=[];
  for(let i=6;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:MONTHS[d.getMonth()].slice(0,3)})}
  const values=months.map(x=>monthRevenue(x.y,x.m,["Paid","Invoiced"]));
  const top=30,bottom=160,plot=bottom-top,vbH=186;
  const maxVal=Math.max(goal,...values)*1.16||1;
  const yFor=v=>bottom-(v/maxVal)*plot;
  const xFor=i=>30+i*((700-30)/(months.length-1));
  const pts=values.map((v,i)=>({x:xFor(i),y:yFor(v)}));
  let path="M"+pts[0].x.toFixed(1)+","+pts[0].y.toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    path+=" C"+(p1.x+(p2.x-p0.x)/6).toFixed(1)+","+(p1.y+(p2.y-p0.y)/6).toFixed(1)+" "+(p2.x-(p3.x-p1.x)/6).toFixed(1)+","+(p2.y-(p3.y-p1.y)/6).toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1);
  }
  const area=path+" L"+pts[pts.length-1].x.toFixed(1)+","+bottom+" L"+pts[0].x.toFixed(1)+","+bottom+" Z";
  const goalTop=yFor(goal);

  const openTasks=tasks.filter(x=>!x.done).length;

  return html`<div className="page">
    <div className="title-row">
      <h1>${pageTitle}</h1>
      <span style=${{fontSize:13,color:"var(--muted)"}}>${boardScoped.length} collaborations in view</span>
      <div style=${{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div className="pills">
          ${["Last month","This month","Next month","This year","All time"].map(x=>html`<button key=${x} type="button" className=${"pill"+(period===x?" on":"")} onClick=${()=>setPeriod(x)}>${x}</button>`)}
        </div>
        <input type="month" aria-label="Pick a specific month" className="sel-box" value=${monthPick?period:""} onChange=${val(v=>{if(v)setPeriod(v)})}/>
      </div>
    </div>

    ${showFinance&&html`<div>
      <section className="kpis">
        ${kpis.map(k=>html`<div key=${k.label} className="card kpi">
          <div className="kicker">${k.label}</div>
          <div className="kpi-val num">${k.value}</div>
          <div className="kpi-delta" style=${{color:k.dc}}>${k.delta}</div>
          <div className="kpi-sub">${k.sub}</div>
        </div>`)}
      </section>
      <section className="chart-row">
        <div className="card chart-card">
          <div style=${{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap",marginBottom:2}}>
            <h3 style=${{fontSize:15,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>Revenue month after month</h3>
            <span style=${{fontSize:12.5,color:"var(--muted)"}}>Paid and invoiced, in DKK</span>
            <div style=${{marginLeft:"auto",display:"flex",alignItems:"baseline",gap:10}}>
              <span className="num" style=${{fontSize:20,fontWeight:700,letterSpacing:"-.03em",color:mom!==null&&mom<0?"var(--muted)":"var(--ink)"}}>${mom===null?"—":(mom>=0?"+":"")+mom+"%"}</span>
              <span style=${{fontSize:12.5,color:"var(--ink-2)"}}>${mom===null?"no comparison with "+MONTHS[prev.getMonth()]:kr(Math.abs(thisMonth-lastMonth))+(thisMonth>=lastMonth?" more than ":" less than ")+MONTHS[prev.getMonth()]}</span>
            </div>
          </div>
          <div style=${{position:"relative",height:186,marginTop:4}}>
            <svg viewBox="0 0 720 186" preserveAspectRatio="none" style=${{position:"absolute",inset:0,width:"100%",height:"100%",display:"block"}} aria-hidden="true">
              <path d=${area} fill="var(--fill)"></path>
              <path d=${"M20,"+goalTop.toFixed(1)+" L700,"+goalTop.toFixed(1)} fill="none" stroke="var(--dash)" strokeWidth="1" strokeDasharray="4 5" vectorEffect="non-scaling-stroke"></path>
              <path d=${path} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"></path>
            </svg>
            <span style=${{position:"absolute",right:0,top:(goalTop/vbH*100).toFixed(2)+"%",transform:"translateY(-135%)",fontSize:10.5,color:"var(--muted)",whiteSpace:"nowrap"}}>Goal ${kr(goal)}</span>
            ${months.map((x,i)=>{const cur=i===months.length-1;const size=cur?10:8;return html`<span key=${i} style=${{position:"absolute",left:(pts[i].x/720*100).toFixed(2)+"%",top:(pts[i].y/vbH*100).toFixed(2)+"%",width:0,height:0}}>
              <span style=${{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:size,height:size,borderRadius:"50%",border:"2px solid var(--ink)",background:cur?"var(--ink)":"var(--surface)"}}></span>
              <span className="num" style=${{position:"absolute",left:"50%",top:-14,transform:"translate(-50%,-100%)",fontSize:11,fontWeight:cur?600:400,color:cur?"var(--ink)":"var(--muted)",whiteSpace:"nowrap"}}>${values[i]>0?krShort(values[i]):"0"}</span>
            </span>`})}
          </div>
          <div style=${{position:"relative",height:26}}>
            ${months.map((x,i)=>{const cur=i===months.length-1;return html`<span key=${i} style=${{position:"absolute",left:(pts[i].x/720*100).toFixed(2)+"%",top:4,transform:"translateX(-50%)",fontSize:11.5,fontWeight:cur?600:400,color:cur?"var(--ink)":"var(--muted)",whiteSpace:"nowrap"}}>${x.label}</span>`})}
          </div>
        </div>

        <div className="card goal-card">
          <div className="kicker" style=${{alignSelf:"stretch"}}>${period==="This year"?"Booked vs year-end goal":"Booked vs goal"}</div>
          <div style=${{position:"relative",width:158,height:158,margin:"18px 0 14px"}}>
            <svg viewBox="0 0 80 80" width="158" height="158" style=${{display:"block",transform:"rotate(-90deg)"}} aria-hidden="true">
              <circle cx="40" cy="40" r="33" fill="none" stroke="var(--hot)" strokeWidth="7"></circle>
              <circle cx="40" cy="40" r="33" fill="none" stroke="var(--ink)" strokeWidth="7" strokeLinecap="round" strokeDasharray=${(RING*Math.min(1,pct/100)).toFixed(1)+" "+RING.toFixed(1)}></circle>
            </svg>
            <div style=${{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <span className="num" style=${{fontSize:34,fontWeight:700,letterSpacing:"-.04em",lineHeight:1}}>${pct}%</span>
              <span className="num" style=${{fontSize:12,color:"var(--muted)",marginTop:4}}>${kr(secured)}</span>
            </div>
          </div>
          <div style=${{alignSelf:"stretch",paddingTop:14,borderTop:"1px solid var(--line)",display:"flex",alignItems:"baseline",gap:4}}>
            <label htmlFor="goal-in" style=${{fontSize:12.5,color:"var(--ink-2)"}}>of</label>
            <input id="goal-in" type="number" step="1000" min="0" className="goal-input num" title="Monthly goal in DKK" value=${goal} onChange=${val(v=>api.settings({goal:Number(v)||0}))}/>
            <span style=${{fontSize:12.5,color:"var(--ink-2)"}}>kr${period==="This year"?"/mo":""}</span>
            <span className="num" style=${{marginLeft:"auto",fontSize:12.5,fontWeight:500,whiteSpace:"nowrap"}}>${pct>=100?"Goal reached":kr(effectiveGoal-secured)+" to go"}</span>
          </div>
          ${period==="This year"&&html`<div style=${{alignSelf:"stretch",marginTop:8,fontSize:11,color:"var(--muted)"}}>${kr(goal)} × ${monthsLeft} months left in ${t.getFullYear()} = ${kr(yearGoal)}</div>`}
        </div>
      </section>
    </div>`}

    ${showToday&&html`<section className="todo">
      <div style=${{display:"flex",alignItems:"baseline",gap:12,marginBottom:14,flexWrap:"wrap"}}>
        <h2 style=${{fontSize:22,fontWeight:700,margin:0,letterSpacing:"-.035em"}}>To do</h2>
        <span style=${{fontSize:14,color:"var(--muted)"}}>${openTasks}${openTasks===1?" thing needs":" things need"} your attention</span>
      </div>
      <div className="todo-grid">
        ${TASK_GROUPS.map(group=>{const items=tasks.filter(x=>x.group===group);return html`<div key=${group}>
          <div style=${{fontSize:12,fontWeight:500,letterSpacing:".14em",textTransform:"uppercase",color:"var(--muted)",marginBottom:10}}>${group}</div>
          ${items.map(x=>html`<div key=${x.id} className="task">
            <button type="button" className=${"check"+(x.done?" done":"")} aria-label=${x.done?"Mark as not done":"Mark as done"} onClick=${()=>api.patch("tasks",x.id,{done:!x.done},0)}></button>
            <div style=${{flex:1,minWidth:0}}>
              <input id=${"task-t-"+x.id} className="quiet" aria-label="Task" value=${x.title} onChange=${val(v=>api.patch("tasks",x.id,{title:v}))}
                style=${{display:"block",width:"100%",fontSize:15,fontWeight:500,letterSpacing:"-.018em",color:x.done?"var(--muted)":"var(--ink)",textDecoration:x.done?"line-through":"none"}}/>
              <div style=${{display:"flex",alignItems:"baseline",gap:8}}>
                <input id=${"task-m-"+x.id} className="quiet" aria-label="Details" placeholder="Add details" value=${x.meta} onChange=${val(v=>api.patch("tasks",x.id,{meta:v}))}
                  style=${{flex:1,minWidth:0,fontSize:13,color:x.done?"var(--dash-2)":"var(--muted)",textDecoration:x.done?"line-through":"none"}}/>
                ${x.collabId&&st.collabs.some(c=>c.id===x.collabId)&&html`<button type="button" onClick=${()=>setOpen(x.collabId)} style=${{flex:"none",background:"transparent",border:0,padding:0,fontSize:11.5,color:"var(--muted)",textDecoration:"underline",textUnderlineOffset:2}}>Open</button>`}
              </div>
            </div>
            <button type="button" className="x" aria-label="Delete task" onClick=${()=>askDelete("Delete this task?","“"+x.title+"” will be removed from To do.",()=>api.remove([["tasks",x.id]]))}>✕</button>
          </div>`)}
          ${items.length===0&&html`<span style=${{fontSize:13,color:"var(--faint)"}}>Nothing here</span>`}
          <button type="button" className="add-row" onClick=${()=>api.add("tasks",{id:uid("t"),group,title:"New task",meta:"",done:false,collabId:""})}>
            <span className="add-dot">+</span><span>Add task</span></button>
        </div>`})}
      </div>
    </section>`}

    <section className="kanban">
      ${KAN.map(col=>{
        const list=boardScoped.filter(c=>c.kanban===col);
        return html`<div key=${col} className=${"col"+(p.dropTarget==="col:"+col?" hot":"")} onDragOver=${p.allowDrop("col:"+col)} onDragLeave=${p.leaveDrop("col:"+col)}
          onDrop=${e=>{e.preventDefault();const d=p.drag.current;p.setDropTarget(null);if(d&&d.kind==="collab")api.patch("collabs",d.id,{kanban:col},0);p.drag.current=null}}>
          <div style=${{display:"flex",alignItems:"baseline",gap:9,padding:"0 2px 12px"}}>
            <h3 style=${{fontSize:14,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>${col}</h3>
            <span className="num" style=${{fontSize:12,color:"var(--faint)"}}>${list.length}</span>
            <span className="num" style=${{marginLeft:"auto",fontSize:12,color:"var(--ink-2)"}}>${kr(list.reduce((a,c)=>a+dkk(c),0))}</span>
          </div>
          <div style=${{display:"flex",flexDirection:"column",gap:10}}>
            ${list.map(c=>html`<${KanbanCard} key=${c.id} c=${c} ...${p}/>`)}
            ${list.length===0&&html`<div className="empty-drop">Drag a collaboration here</div>`}
            <button type="button" className="add-collab" onClick=${()=>p.newCollab(col)}>+ Add collaboration</button>
          </div>
        </div>`;
      })}
    </section>
  </div>`;
}

/* ---------- Calendar ---------- */
function Calendar(p){
  const {st,api,brandOf,calMode,setCalMode,cursor,setCursor,sidebar,setSidebar,openQuick,setOpen,setTab,askDelete,drag,setDropTarget,dropTarget}=p;
  const {deliverables,ideas}=st;
  const cur=parse(cursor);
  const weekStart=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-((cur.getDay()+6)%7));
  const step=n=>()=>setCursor(isoOf(calMode==="Week"?new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7*n):new Date(cur.getFullYear(),cur.getMonth()+n,1)));
  const openCollab=id=>{setTab("dash");setOpen(id)};

  const dropOnDate=iso=>e=>{
    e.preventDefault();const d=drag.current;setDropTarget(null);if(!d)return;
    if(d.kind==="deliverable"){const x=deliverables.find(o=>o.id===d.id);api.patch("deliverables",d.id,{publishDate:iso,status:x&&x.status==="Published"?"Published":"Scheduled"},0)}
    if(d.kind==="idea")api.patch("ideas",d.id,{scheduledDate:iso},0);
    drag.current=null;
  };
  const dropOnSidebar=e=>{
    e.preventDefault();const d=drag.current;setDropTarget(null);if(!d)return;
    if(d.kind==="deliverable")api.patch("deliverables",d.id,{publishDate:""},0);
    if(d.kind==="idea")api.patch("ideas",d.id,{scheduledDate:""},0);
    drag.current=null;
  };

  let start,count;
  if(calMode==="Week"){start=weekStart;count=7}
  else{const first=new Date(cur.getFullYear(),cur.getMonth(),1);start=new Date(cur.getFullYear(),cur.getMonth(),1-((first.getDay()+6)%7));count=42}
  const cells=[];
  for(let i=0;i<count;i++){
    const day=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const iso=isoOf(day);
    const items=[];
    deliverables.filter(d=>d.publishDate===iso).forEach(d=>items.push({key:d.id,kind:"deliverable",icon:html`<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><rect x="0.5" y="0.5" width="7" height="7" rx="1.5" fill="var(--ink)"/></svg>`,title:brandOf(d.collabId)+" — "+d.name,onClick:e=>{e.stopPropagation();openCollab(d.collabId)}}));
    ideas.filter(x=>x.scheduledDate===iso).forEach(x=>items.push({key:x.id,kind:"idea",icon:html`<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="none" stroke="var(--ink)" stroke-width="1.3"/></svg>`,title:x.title,onClick:e=>e.stopPropagation()}));
    cells.push({iso,num:day.getDate(),dim:calMode==="Month"&&day.getMonth()!==cur.getMonth(),today:iso===TODAY,items});
  }
  if(calMode==="Month"){while(cells.length>35&&cells.slice(-7).every(c=>c.dim))cells.splice(-7)}

  const monthStart=isoOf(new Date(cur.getFullYear(),cur.getMonth(),1));
  const rows=[];
  deliverables.filter(d=>d.publishDate&&d.publishDate>=monthStart).forEach(d=>rows.push({key:d.id,sort:d.publishDate,title:brandOf(d.collabId)+" — "+d.name,meta:d.platform+" · "+d.type,status:d.status,onClick:()=>openCollab(d.collabId)}));
  ideas.filter(x=>x.scheduledDate&&x.scheduledDate>=monthStart).forEach(x=>rows.push({key:x.id,sort:x.scheduledDate,title:x.title,meta:x.platform+" · "+x.type,status:"Idea",onClick:()=>{}}));
  rows.sort((a,b)=>a.sort.localeCompare(b.sort));

  const unsD=deliverables.filter(d=>!d.publishDate);
  const unsI=ideas.filter(x=>!x.scheduledDate);

  return html`<div className="cal-wrap">
    <div className="cal-main">
      <div style=${{display:"flex",alignItems:"center",gap:14,marginBottom:14,flexWrap:"wrap"}}>
        <h2 style=${{fontSize:24,fontWeight:700,margin:0,minWidth:190,letterSpacing:"-.035em"}}>${calMode==="Week"?"Week of "+fmtDate(isoOf(weekStart)):calMode==="List"?"From "+MONTHS[cur.getMonth()]+" "+cur.getFullYear():MONTHS[cur.getMonth()]+" "+cur.getFullYear()}</h2>
        <div style=${{display:"flex",gap:6}}>
          <button type="button" className="nav-btn" aria-label="Previous" onClick=${step(-1)}>←</button>
          <button type="button" className="nav-btn" aria-label="Next" onClick=${step(1)}>→</button>
          <button type="button" className="nav-btn" style=${{width:"auto",padding:"0 13px",fontSize:12.5}} onClick=${()=>setCursor(TODAY)}>Today</button>
        </div>
        <div className="pills" style=${{marginLeft:"auto",padding:4}}>
          ${["Month","Week","List"].map(m=>html`<button key=${m} type="button" className=${"pill"+(calMode===m?" on":"")} onClick=${()=>setCalMode(m)}>${m}</button>`)}
        </div>
      </div>

      ${calMode!=="List"?html`<div className="card grid-scroll" style=${{padding:"16px 18px 18px"}}>
        <div className="grid7" style=${{marginBottom:8}}>${DAYNAMES.map(d=>html`<span key=${d} className="kicker" style=${{paddingLeft:4}}>${d}</span>`)}</div>
        <div className="grid7">
          ${cells.map(c=>html`<div key=${c.iso} className=${"cell"+(dropTarget==="date:"+c.iso?" hot":"")}
              style=${{minHeight:calMode==="Week"?340:112,opacity:c.dim?.45:1}}
              onClick=${()=>openQuick(c.iso)} onDragOver=${p.allowDrop("date:"+c.iso)} onDragLeave=${p.leaveDrop("date:"+c.iso)} onDrop=${dropOnDate(c.iso)}>
            <div style=${{marginBottom:6}}>
              <span className="num" style=${c.today?{fontSize:11.5,background:"var(--ink)",color:"var(--surface)",borderRadius:999,padding:"2px 7px",fontWeight:500}:{fontSize:11.5,color:"var(--muted)"}}>${c.num}</span>
            </div>
            <div style=${{display:"flex",flexDirection:"column",gap:5}}>
              ${c.items.map(it=>html`<div key=${it.key} className=${"chip"+(it.kind==="idea"?" idea":"")} draggable="true" title=${it.title}
                  onDragStart=${p.startDrag(it.kind,it.key)} onDragEnd=${p.endDrag} onClick=${it.onClick}>
                <span style=${{flex:"none",display:"flex",alignItems:"center"}}>${it.icon}</span><span className="chip-t">${it.title}</span></div>`)}
            </div>
          </div>`)}
        </div>
      </div>`:html`<div className="card" style=${{padding:"6px 20px 14px"}}>
        ${rows.length===0&&html`<p style=${{color:"var(--muted)",fontSize:13,padding:"14px 8px",margin:0}}>Nothing scheduled from here on.</p>`}
        ${rows.map(r=>html`<div key=${r.key} className="list-row" onClick=${r.onClick}>
          <span className="num" style=${{fontSize:12,color:"var(--ink-2)"}}>${parse(r.sort).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span>
          <span style=${{fontSize:13.5}}>${r.title}</span>
          <span className="lr-meta" style=${{fontSize:12,color:"var(--muted)"}}>${r.meta}</span>
          <span style=${{fontSize:11.5,borderRadius:999,padding:"3px 10px",justifySelf:"start",background:r.status==="Published"?"var(--bg)":"var(--ink)",color:r.status==="Published"?"var(--muted)":"var(--surface)"}}>${r.status}</span>
        </div>`)}
      </div>`}
    </div>

    <aside className=${"side"+(dropTarget==="side"?" hot":"")} style=${{width:sidebar?294:50}} onDragOver=${p.allowDrop("side")} onDragLeave=${p.leaveDrop("side")} onDrop=${dropOnSidebar}>
      ${sidebar?html`<div style=${{padding:"20px 20px 36px"}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <h3 style=${{fontSize:15,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>Unscheduled</h3>
          <button type="button" className="nav-btn" style=${{marginLeft:"auto",width:26,height:26,borderRadius:8,fontSize:12}} aria-label="Collapse" onClick=${()=>setSidebar(false)}>→</button>
        </div>
        <p style=${{fontSize:12,color:"var(--muted)",margin:"0 0 18px"}}>Drag onto a date to schedule it. Drag back here to unschedule.</p>
        <div className="kicker" style=${{marginBottom:10}}>Deliverables</div>
        <div style=${{display:"flex",flexDirection:"column",gap:7,marginBottom:22}}>
          ${unsD.map(d=>html`<div key=${d.id} className="uns" draggable="true" onDragStart=${p.startDrag("deliverable",d.id)} onDragEnd=${p.endDrag} onClick=${()=>openCollab(d.collabId)}>
            <span style=${{display:"block",fontSize:12.5}}>${brandOf(d.collabId)} — ${d.name}</span>
            <span style=${{display:"block",fontSize:11,color:"var(--muted)"}}>${d.platform} · ${d.type}</span></div>`)}
          ${unsD.length===0&&html`<span style=${{fontSize:12,color:"var(--muted)"}}>All scheduled.</span>`}
        </div>
        <div className="kicker" style=${{marginBottom:10}}>Content ideas</div>
        <div style=${{display:"flex",flexDirection:"column",gap:7,marginBottom:10}}>
          ${unsI.map(x=>html`<div key=${x.id} className="uns-idea" draggable="true" onDragStart=${p.startDrag("idea",x.id)} onDragEnd=${p.endDrag}>
            <div style=${{display:"flex",alignItems:"flex-start",gap:6}}>
              <input id=${"it-"+x.id} aria-label="Idea title" className="quiet quiet-w" value=${x.title} onChange=${val(v=>api.patch("ideas",x.id,{title:v}))} style=${{flex:1,minWidth:0,fontSize:12.5,marginLeft:-3,padding:"1px 3px"}}/>
              <button type="button" className="x" style=${{width:18,height:18,fontSize:11}} aria-label="Delete idea" onClick=${()=>askDelete("Delete this idea?","“"+x.title+"” will be removed.",()=>api.remove([["ideas",x.id]]))}>✕</button>
            </div>
            <input id=${"ih-"+x.id} aria-label="Hook" placeholder="Hook" className="quiet quiet-w" value=${x.hook} onChange=${val(v=>api.patch("ideas",x.id,{hook:v}))} style=${{display:"block",width:"100%",fontSize:11,color:"var(--muted)",marginLeft:-3,padding:"1px 3px"}}/>
          </div>`)}
        </div>
        <button type="button" className="add-row" style=${{fontSize:12.5,gap:8}} onClick=${()=>api.add("ideas",{id:uid("i"),title:"New idea",hook:"",concept:"",platform:"Instagram",type:"Reel",collabId:"",scheduledDate:""})}>
          <span className="add-dot" style=${{width:18,height:18,fontSize:11}}>+</span><span>Add idea</span></button>
      </div>`:html`<button type="button" onClick=${()=>setSidebar(true)} style=${{width:"100%",height:"100%",minHeight:220,border:0,background:"transparent",writingMode:"vertical-rl",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--muted)"}}>Unscheduled · ${unsD.length+unsI.length}</button>`}
    </aside>
  </div>`;
}

/* ---------- Contacts ---------- */
function Contacts(p){
  const {st,api,cFilter,setCFilter,cSort,setCSort,setOpen,setTab,askDelete,newCollab}=p;
  const {contacts,collabs,deliverables}=st;
  const rows=contacts.filter(c=>cFilter==="All statuses"||c.status===cFilter).slice().sort((a,b)=>{
    if(cSort==="Brand A–Z")return (a.brand||"").localeCompare(b.brand||"");
    if(cSort==="Last contact")return (b.lastContactDate||"").localeCompare(a.lastContactDate||"");
    return (a.followUpDate||"9999").localeCompare(b.followUpDate||"9999");
  });
  const addContact=()=>{setCFilter("All statuses");setCSort("Follow-up date");api.add("contacts",{id:uid("c"),brand:"New brand",person:"",email:"",website:"",social:"",folder:"",lastContactDate:"",followUpDate:TODAY,status:"No response"})};

  return html`<div className="page" style=${{paddingTop:24}}>
    <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
      <h2 style=${{fontSize:24,fontWeight:700,margin:0,letterSpacing:"-.035em"}}>Contacts</h2>
      <span className="num" style=${{fontSize:12.5,color:"var(--muted)"}}>${rows.length} of ${contacts.length}</span>
      <div style=${{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <select id="c-filter" aria-label="Filter by relationship" className="sel-box" value=${cFilter} onChange=${val(setCFilter)}><${Options} list=${["All statuses"].concat(CSTATUS)}/></select>
        <select id="c-sort" aria-label="Sort" className="sel-box" value=${cSort} onChange=${val(setCSort)}><${Options} list=${["Follow-up date","Brand A–Z","Last contact"]}/></select>
        <button type="button" className="btn-dark" style=${{padding:"6px 14px",fontSize:12.5,borderRadius:9}} onClick=${addContact}>Add contact</button>
      </div>
    </div>
    <div className="ctable">
      <div className="crow head">${["Brand","Contact","Email","Relationship","History","Last contacted","Contact again",""].map((h,i)=>html`<span key=${i} className="kicker">${h}</span>`)}</div>
      ${rows.length===0&&html`<p style=${{color:"var(--muted)",padding:"16px 8px",margin:0}}>No contacts with this status.</p>`}
      ${rows.map(c=>{
        const due=c.followUpDate&&c.followUpDate<=TODAY;
        const mine=collabs.filter(x=>x.contactId===c.id);
        const bold=c.status==="Follow up"||c.status==="No response";
        return html`<div key=${c.id} className="crow">
          <div style=${{minWidth:0}}>
            <input id=${"cb-"+c.id} aria-label="Brand" className="cin" value=${c.brand} onChange=${val(v=>api.patch("contacts",c.id,{brand:v}))} style=${{display:"block",fontSize:13.5,fontWeight:500}}/>
            <input id=${"cl-"+c.id} aria-label="Social handle" placeholder="@handle" className="cin" value=${c.social||""} onChange=${val(v=>api.patch("contacts",c.id,{social:v}))} style=${{display:"block",fontSize:11,color:"var(--muted)",padding:"0 5px"}}/>
          </div>
          <input id=${"cp-"+c.id} aria-label="Contact person" placeholder="Name" className="cin" value=${c.person} onChange=${val(v=>api.patch("contacts",c.id,{person:v}))} style=${{fontSize:12.5}}/>
          <input id=${"ce-"+c.id} aria-label="Email" placeholder="email@brand.com" className="cin" value=${c.email} onChange=${val(v=>api.patch("contacts",c.id,{email:v}))} style=${{fontSize:12,color:"var(--ink-2)"}}/>
          <select id=${"cs-"+c.id} aria-label="Relationship" className="qsel" value=${c.status} onChange=${val(v=>api.patch("contacts",c.id,{status:v},0))}
            style=${{color:c.status==="Hard no"?"var(--faint)":bold?"var(--ink)":"var(--ink-2)",fontWeight:bold?500:400}}><${Options} list=${CSTATUS}/></select>
          <button type="button" className="num" onClick=${()=>{if(mine.length){setTab("dash");setOpen(mine[0].id)}else newCollab("Potential",c)}}
            style=${{justifySelf:"start",background:"transparent",border:0,padding:0,fontSize:12,color:"var(--ink-2)",textDecoration:"underline",textUnderlineOffset:2}}>${mine.length===0?"Start collab":mine.length===1?"1 collab":mine.length+" collabs"}</button>
          <input id=${"clc-"+c.id} type="date" aria-label="Last contacted" className="date-in num" value=${c.lastContactDate||""} onChange=${val(v=>api.patch("contacts",c.id,{lastContactDate:v},0))}/>
          <span className=${due?"due":""} style=${{display:"block"}}>
            <input id=${"cf-"+c.id} type="date" aria-label="Contact again" className="date-in num" value=${c.followUpDate||""} onChange=${val(v=>api.patch("contacts",c.id,{followUpDate:v},0))}/>
          </span>
          <button type="button" className="x" aria-label=${"Delete "+c.brand} onClick=${()=>askDelete("Delete "+c.brand+"?",mine.length?"This contact has "+mine.length+(mine.length===1?" collaboration":" collaborations")+". They will be deleted too.":"The contact will be removed.",()=>{
            const ids=mine.map(x=>x.id);
            const dels=deliverables.filter(d=>ids.includes(d.collabId));
            api.remove([["contacts",c.id],...ids.map(id=>["collabs",id]),...dels.flatMap(d=>[["deliverables",d.id],["tasks","cd-"+d.id]])]);
          })}>✕</button>
        </div>`;
      })}
    </div>
  </div>`;
}

          </div>
          <div className="stat" style=${{padding:"10px 13px"}}><span className="kicker" style=${{display:"block",marginBottom:5}}>In DKK</span><span className="num" style=${tall}>${kr(dkk(oc))}</span></div>
          <div className="stat" style=${{padding:"10px 13px"}}><span className="kicker" style=${{display:"block",marginBottom:5}}>${cutLabel}</span><span className="num" style=${tall}>${oc.owner==="Steph"?kr(dkk(oc)*STEPH_CUT):"Aleksandra"}</span></div>
        </div>

        <div className="fgrid">
          ${fields.map(f=>html`<label key=${f.k} style=${{display:"block",marginBottom:10,minWidth:0}}>
            <span style=${{display:"flex",alignItems:"baseline",gap:8,marginBottom:3}}>
              <span className="kicker">${f.label}</span>
              ${f.href&&html`<a href=${f.href} target="_blank" rel="noopener" onClick=${stop} style=${{fontSize:11}}>Open</a>`}
            </span>
            <input id=${"m-"+f.k} className="field" type=${f.type||"text"} value=${f.value||""} onChange=${f.on}/>
          </label>`)}
        </div>

        <div style=${{margin:"4px 0 16px"}}>
          <label htmlFor="m-pitch" className="kicker" style=${{display:"block",marginBottom:5}}>Content pitch</label>
          <textarea id="m-pitch" className="field" rows="2" value=${oc.pitch} onChange=${pc("pitch")} style=${{borderRadius:11,padding:"9px 11px",lineHeight:1.5,resize:"vertical"}}></textarea>
          <label htmlFor="m-notes" className="kicker" style=${{display:"block",margin:"10px 0 5px"}}>Notes</label>
          <textarea id="m-notes" className="field" rows="3" value=${oc.notes} onChange=${pc("notes")} style=${{borderRadius:11,padding:"9px 11px",lineHeight:1.55,resize:"vertical"}}></textarea>
        </div>

        <div>
          <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <h4 style=${{fontSize:16,fontWeight:600,margin:0,letterSpacing:"-.022em"}}>Deliverables</h4>
            <span style=${{fontSize:12,color:"var(--muted)"}}>${dels.length} total · ${dels.filter(d=>d.publishDate).length} scheduled</span>
            <button type="button" className="btn-dark" style=${{marginLeft:"auto",borderRadius:8,padding:"6px 14px",fontSize:12.5}}
              onClick=${()=>api.add("deliverables",{id:uid("d"),collabId:oc.id,name:"New deliverable",platform:"Instagram",type:"Reel",status:"Idea",shootDate:"",editDeadline:"",publishDate:"",notes:"",link:""})}>Add</button>
          </div>
          <div style=${{display:"flex",flexDirection:"column",gap:10}}>
            ${dels.length===0&&html`<div className="empty-drop">No deliverables yet</div>`}
            ${dels.map(d=>html`<div key=${d.id} className="del">
              <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
                <input id=${"dn-"+d.id} aria-label="Deliverable name" className="quiet quiet-w" value=${d.name} onChange=${val(v=>api.patch("deliverables",d.id,{name:v}))} style=${{flex:"1 1 160px",minWidth:0,fontSize:13.5,fontWeight:500,padding:"2px 4px"}}/>
                <select id=${"dp-"+d.id} aria-label="Platform" value=${d.platform} onChange=${val(v=>api.patch("deliverables",d.id,{platform:v},0))} style=${{border:0,borderRadius:8,background:"var(--surface)",padding:"4px 9px",fontSize:11.5}}><${Options} list=${PLATFORMS}/></select>
                <select id=${"ds-"+d.id} aria-label="Status" value=${d.status} onChange=${val(v=>api.patch("deliverables",d.id,{status:v},0))}
                  style=${{border:0,borderRadius:8,padding:"4px 10px",fontSize:11.5,background:d.status==="Published"?"var(--surface)":"var(--ink)",color:d.status==="Published"?"var(--muted)":"var(--surface)"}}><${Options} list=${DSTATUS}/></select>
                <button type="button" className="x" style=${{color:"var(--faint)"}} aria-label="Delete deliverable" onClick=${()=>askDelete("Delete this deliverable?","“"+d.name+"” will be removed from "+oc.brand+" and from the calendar.",()=>api.remove([["deliverables",d.id],["tasks","cd-"+d.id]]))}>✕</button>
              </div>
              <div style=${{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:10}}>
                ${[["shootDate","Shoot"],["editDeadline","Edit by"],["publishDate","Publish"]].map(([k,l])=>html`<label key=${k} style=${{display:"block",minWidth:0}}>
                  <span style=${{display:"block",fontSize:10,fontWeight:500,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>${l}</span>
                  <input id=${"d"+k+"-"+d.id} type="date" className="del-date num" value=${d[k]||""} onChange=${val(v=>api.patch("deliverables",d.id,k==="publishDate"?{publishDate:v,status:v&&d.status==="Idea"?"Scheduled":d.status}:{[k]:v},0))}/>
                </label>`)}
              </div>
            </div>`)}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
