  const collabDate=c=>{const d=deliverables.filter(x=>x.collabId===c.id&&x.publishDate).map(x=>x.publishDate).sort();return d[0]||c.endDate||c.startDate||TODAY};
  const t=parse(TODAY);
  const prev=new Date(t.getFullYear(),t.getMonth()-1,1);
  const next=new Date(t.getFullYear(),t.getMonth()+1,1);
  const monthPick=/^(\d{4})-(\d{2})$/.exec(period);
  const inPeriod=iso=>{
    if(period==="All time")return true;
    const d=parse(iso)||t;
    if(monthPick)return d.getFullYear()===Number(monthPick[1])&&d.getMonth()===Number(monthPick[2])-1;
    if(period==="This year")return d.getFullYear()===t.getFullYear();
    if(period==="This month")return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth();
    if(period==="Next month")return d.getFullYear()===next.getFullYear()&&d.getMonth()===next.getMonth();
    return d.getFullYear()===prev.getFullYear()&&d.getMonth()===prev.getMonth();
  };
  // Matches the Deals board's own math: a collab's price is split evenly
  // across its deliverables, and each reel counts toward the month it's
  // actually dated for -- not the collab's single earliest date. A collab
  // with no deliverables yet falls back to collabDate() so it still counts
  // somewhere.
  // Mirrors the Deals board exactly: a collab's price splits evenly across
  // its deliverables, and only a deliverable with an actual publish date in
  // (y,m) counts toward that month. A collab with no deliverables yet
  // contributes to no month -- it still counts in "Booked in total" (which
  // isn't date-based), just not here, so this can never disagree with what
  // the board shows.
  const monthRevenue=(y,m,statuses)=>{
    let total=0;
    collabs.filter(c=>statuses.includes(c.finStatus)).forEach(c=>{
      const dels=deliverables.filter(d=>d.collabId===c.id);
      if(dels.length===0)return;
      const perReelVal=Math.round(dkk(c)/dels.length);
      dels.forEach(d=>{
        if(!d.publishDate)return;
        const pd=parse(d.publishDate);
        if(pd.getFullYear()===y&&pd.getMonth()===m)total+=perReelVal;
      });
    });
    return total;
  };

  const askDelete=(title,detail,onYes)=>setConfirm({title,detail,onYes});
  const startDrag=(kind,id)=>e=>{drag.current={kind,id};if(e.dataTransfer){e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",id)}catch(err){}}};
  const endDrag=()=>{drag.current=null;setDropTarget(null)};
  const allowDrop=target=>e=>{e.preventDefault();if(dropTarget!==target)setDropTarget(target)};
  const leaveDrop=target=>e=>{if(!e.currentTarget.contains(e.relatedTarget)&&dropTarget===target)setDropTarget(null)};

  const deleteCollab=c=>{
    const dels=deliverables.filter(d=>d.collabId===c.id);
    askDelete("Delete "+c.brand+"?","The collaboration and its "+dels.length+(dels.length===1?" deliverable go":" deliverables go")+" with it. The contact stays in Contacts.",()=>{
      api.remove([["collabs",c.id],...dels.flatMap(d=>[["deliverables",d.id],["tasks","cd-"+d.id]])]);
      if(open===c.id)setOpen(null);
    });
  };
  const newCollab=(kanban,contact)=>{
    let ct=contact;
    if(!ct)ct=api.add("contacts",{id:uid("c"),brand:"New brand",person:"",email:"",website:"",social:"",folder:"",lastContactDate:TODAY,followUpDate:"",status:"Responded"});
    const c=api.add("collabs",{id:uid("k"),contactId:ct.id,brand:ct.brand,owner:"Aleksandra",price:0,currency:"DKK",finStatus:kanban==="Potential"?"Potential":kanban==="Completed"?"Paid":"Booked",stage:kanban==="Completed"?"Done":kanban==="Ongoing"?"Order products":"Need to respond",kanban:kanban||"Potential",pitch:"",notes:"",folder:"",contract:"",startDate:"",endDate:"",invoice:""});
    setTab("dash");setOpen(c.id);
  };
  const newDealInMonth=(y,m)=>{
    const ct=api.add("contacts",{id:uid("c"),brand:"New brand",person:"",email:"",website:"",social:"",folder:"",lastContactDate:TODAY,followUpDate:"",status:"Responded"});
    const c=api.add("collabs",{id:uid("k"),contactId:ct.id,brand:ct.brand,owner:"Aleksandra",price:0,currency:"DKK",finStatus:"Booked",stage:"Need to respond",kanban:"Ongoing",pitch:"",notes:"",folder:"",contract:"",startDate:"",endDate:"",invoice:""});
    api.add("deliverables",{id:uid("d"),collabId:c.id,name:"New deliverable",platform:"Instagram",type:"Reel",status:"Idea",shootDate:"",editDeadline:"",publishDate:isoOf(new Date(y,m,1)),notes:"",link:""});
    setTab("dash");setOpen(c.id);
  };
  // Moving a collab to "Send invoice" also files it under Completed; the
  // to-do list picks it up from there (see derived tasks in Dashboard).
  const setStage=(c,stage)=>{
    api.patch("collabs",c.id,stage==="Send invoice"?{stage,kanban:"Completed"}:{stage},0);
  };
  const setKanban=(c,kanban)=>{
    api.patch("collabs",c.id,{kanban},0);
  };

  const common={st,api,dkk,brandOf,collabDate,startDrag,endDrag,allowDrop,leaveDrop,dropTarget,setDropTarget,drag,askDelete,setOpen,setOpenContact,setTab,deleteCollab,newCollab,newDealInMonth,setStage,setKanban};

  const sync = st.mode==="loading"?"Loading…":st.mode==="local"?"Example data · not saved":st.mode==="offline"?"Read-only":(st.saving?"Saving…":"Saved");

  return html`
  <div>
    <header className="hdr">
      <div className="hdr-row">
        <span className="brand">Collabs</span>
        <nav className="tabs">
          ${[["dash","Dashboard"],["cal","Calendar"],["contacts","Contacts"],["archive","Archive"]].map(([k,l])=>html`<button key=${k} type="button" className=${"tab"+(tab===k?" on":"")} onClick=${()=>setTab(k)}>${l}</button>`)}
        </nav>
        <div className="hdr-right">
          <div style=${{display:"flex",gap:4}}>
            <${Toggle} label="Finance" on=${showFinance} onClick=${()=>setShowFinance(!showFinance)}/>
            <${Toggle} label="To do" on=${showToday} onClick=${()=>setShowToday(!showToday)}/>
          </div>
          <span className="sync" aria-live="polite">${sync}</span>
          <span className="today-lbl num" style=${{fontSize:13,color:"var(--muted)"}}>${t.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</span>
          <button type="button" className="acct" onClick=${()=>setLogin(true)} title=${SUPABASE_READY?"Account":"Your label on this device"}>
            <span className="avatar">${(email||"?").slice(0,2).toUpperCase()}</span>
            <span style=${{fontSize:12.5,fontWeight:500}}>${(email||"").split("@")[0]}</span>
          </button>
        </div>
      </div>
      ${st.error&&html`<div style=${{display:"flex",gap:10,alignItems:"center",padding:"8px 0",fontSize:12.5}}>
        <span>${st.error}</span><button type="button" className="x" onClick=${api.clearError} aria-label="Dismiss">✕</button></div>`}
    </header>

    ${tab==="dash"&&html`<${Dashboard} ...${common} period=${period} setPeriod=${setPeriod} showFinance=${showFinance} showToday=${showToday}
        boardView=${boardView} setBoardView=${setBoardView}
        goal=${goal} inPeriod=${inPeriod} monthRevenue=${monthRevenue} t=${t} prev=${prev} next=${next}/>`}
    ${tab==="cal"&&html`<${Calendar} ...${common} calMode=${calMode} setCalMode=${setCalMode} cursor=${cursor} setCursor=${setCursor}
        sidebar=${sidebar} setSidebar=${setSidebar} openQuick=${iso=>{setQuick(iso);setQuickTitle("")}}/>`}
    ${tab==="contacts"&&html`<${Contacts} ...${common} cFilter=${cFilter} setCFilter=${setCFilter} cSort=${cSort} setCSort=${setCSort}/>`}
    ${tab==="archive"&&html`<${Archive} ...${common}/>`}

    ${open&&collabs.find(c=>c.id===open)&&html`<${CollabPanel} ...${common} collab=${collabs.find(c=>c.id===open)} onClose=${()=>setOpen(null)}/>`}
    ${openContact&&contacts.find(c=>c.id===openContact)&&html`<${ContactPanel} ...${common} contact=${contacts.find(c=>c.id===openContact)} onClose=${()=>setOpenContact(null)}/>`}

    ${quick&&html`<div className="scrim center" onClick=${()=>setQuick(null)}>
      <div className="dialog" onClick=${stop} role="dialog" aria-modal="true" aria-labelledby="qa-t">
        <h4 id="qa-t">Add event</h4>
        <p style=${{fontSize:12.5,color:"var(--muted)",margin:"0 0 16px"}}>${parse(quick).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</p>
        <form onSubmit=${e=>{e.preventDefault();const title=quickTitle.trim();if(title)api.add("ideas",{id:uid("i"),title,hook:"",concept:"",platform:"Instagram",type:"Reel",collabId:"",scheduledDate:quick});setQuick(null)}}>
          <label style=${{display:"block",marginBottom:18}}>
            <span className="kicker" style=${{display:"block",marginBottom:5}}>Title</span>
            <input id="quick-title" className="field" autoFocus value=${quickTitle} onChange=${val(setQuickTitle)} placeholder="e.g. Hallway before and after"/>
          </label>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button type="button" className="btn" onClick=${()=>setQuick(null)}>Cancel</button>
            <button type="submit" className="btn-dark">💡 Add idea</button>
          </div>
        </form>
      </div></div>`}

    ${login&&html`<div className="scrim center" onClick=${()=>setLogin(false)}>
      <div className="dialog" onClick=${stop} role="dialog" aria-modal="true" aria-labelledby="lg-t" aria-describedby="lg-d">
        <h4 id="lg-t">${SUPABASE_READY?"Your account":"Your label on this device"}</h4>
        ${SUPABASE_READY?html`
          <p id="lg-d" style=${{fontSize:12.5,color:"var(--muted)",margin:"0 0 20px",lineHeight:1.5}}>Signed in as <strong>${email}</strong>. Sign out to switch accounts on this device.</p>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button type="button" className="btn" onClick=${()=>setLogin(false)}>Close</button>
            <button type="button" className="btn-dark" onClick=${async()=>{await supabase.auth.signOut();setLogin(false)}}>Sign out</button>
          </div>
        `:html`
          <p id="lg-d" style=${{fontSize:12.5,color:"var(--muted)",margin:"0 0 20px",lineHeight:1.5}}>This is example data running without a database — see the project README to connect Supabase so changes save for the whole team.</p>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button type="button" className="btn" onClick=${()=>setLogin(false)}>Close</button>
          </div>
        `}
      </div></div>`}

    ${confirm&&html`<div className="scrim center" onClick=${()=>setConfirm(null)}>
      <div className="dialog" style=${{width:"min(400px,100%)"}} onClick=${stop} role="alertdialog" aria-modal="true" aria-labelledby="cf-t">
        <h4 id="cf-t" style=${{marginBottom:6}}>${confirm.title}</h4>
        <p style=${{fontSize:13.5,color:"var(--ink-2)",margin:"0 0 20px"}}>${confirm.detail}</p>
        <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button type="button" className="btn" onClick=${()=>setConfirm(null)}>Cancel</button>
          <button type="button" className="btn-dark" autoFocus onClick=${()=>{const c=confirm;setConfirm(null);c.onYes()}}>Delete</button>
        </div>
      </div></div>`}
  </div>`;
}

/* ---------- Dashboard ---------- */
function Dashboard(p){
  const {st,api,dkk,collabDate,period,setPeriod,showFinance,showToday,boardView,setBoardView,goal,inPeriod,monthRevenue,t,prev,next,setOpen,askDelete}=p;
  const {collabs,deliverables,tasks}=st;
  const shopify=useShopify();
  // The board is a look-ahead view, not an accounting one: a collab with
  // deliverables spanning two months should show up under both.
  const boardScoped=collabs.filter(c=>{
    if(c.archived)return false;
    const dates=deliverables.filter(d=>d.collabId===c.id&&d.publishDate).map(d=>d.publishDate);
    const candidates=dates.length?dates:[collabDate(c)];
    return candidates.some(inPeriod);
  });
  // Same per-reel, per-period math as monthRevenue/the Deals board: a
  // collab's price splits across its deliverables, and only a deliverable
  // actually dated inside the selected period counts.
  const periodRevenue=pred=>{
    let total=0;
    collabs.filter(pred).forEach(c=>{
      const dels=deliverables.filter(d=>d.collabId===c.id);
      if(dels.length===0)return;
      const perReelVal=Math.round(dkk(c)/dels.length);
      dels.forEach(d=>{if(d.publishDate&&inPeriod(d.publishDate))total+=perReelVal});
    });
    return total;
  };
  const periodCollabCount=pred=>collabs.filter(c=>pred(c)&&deliverables.some(d=>d.collabId===c.id&&d.publishDate&&inPeriod(d.publishDate))).length;
  const secured=periodRevenue(c=>c.finStatus!=="Potential");
  const pct=goal>0?Math.round(secured/goal*100):0;
  const stephCollabCount=periodCollabCount(c=>c.owner==="Steph");
  const stephCut=periodRevenue(c=>c.owner==="Steph")*STEPH_CUT;
  const bookedTotal=collabs.filter(c=>c.finStatus==="Booked").reduce((a,c)=>a+dkk(c),0);
  const bookedThisMonth=monthRevenue(t.getFullYear(),t.getMonth(),["Booked"]);
  const bookedLastMonth=monthRevenue(prev.getFullYear(),prev.getMonth(),["Booked"]);
  const momBooked=bookedLastMonth>0?Math.round((bookedThisMonth-bookedLastMonth)/bookedLastMonth*100):null;
  const paidThisMonth=monthRevenue(t.getFullYear(),t.getMonth(),["Paid"]);
  const invoicedThisMonth=monthRevenue(t.getFullYear(),t.getMonth(),["Invoiced"]);
  const bookedSubParts=[];
  if(paidThisMonth>0)bookedSubParts.push(kr(paidThisMonth)+" paid");
  if(invoicedThisMonth>0)bookedSubParts.push(kr(invoicedThisMonth)+" invoiced");
  const monthPick=/^(\d{4})-(\d{2})$/.exec(period);
  const titleMap={"This month":MONTHS[t.getMonth()]+" performance","Last month":MONTHS[prev.getMonth()]+" performance","Next month":MONTHS[next.getMonth()]+" performance","This year":t.getFullYear()+" performance","All time":"All-time performance"};
  const pageTitle=monthPick?MONTHS[Number(monthPick[2])-1]+" "+monthPick[1]+" performance":(titleMap[period]||"Performance");

  // Separate from the collab numbers on purpose: this is store revenue.
  const shopifyTile=(()=>{
    const label="Shopify sales this month";
    if(shopify.status==="ready"){
      const money=v=>shopify.currency&&shopify.currency!=="DKK"?Math.round(v).toLocaleString("da-DK")+" "+shopify.currency:kr(v);
      const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
      const row=k=>shopify.months.find(m=>m.month===k)||{total_sales:0,net_sales:0,orders:0};
      const cur=row(key(t)),prv=row(key(prev));
      const chg=prv.total_sales?Math.round((cur.total_sales-prv.total_sales)/Math.abs(prv.total_sales)*100):null;
      return {label,value:money(cur.total_sales),delta:chg===null?"No comparison":(chg>=0?"+":"")+chg+"% vs "+MONTHS[prev.getMonth()],dc:chg!==null&&chg<0?"var(--muted)":"var(--ink)",
        sub:money(cur.net_sales)+" net · "+cur.orders+(cur.orders===1?" order":" orders")};
    }
    if(shopify.status==="loading")return {label,value:"…",delta:"Loading",dc:"var(--ink-2)",sub:"Fetching from Shopify"};
    return {label,value:"—",delta:"Not connected",dc:"var(--ink-2)",
      sub:shopify.status==="off"?"Available on the live site":shopify.error==="not_configured"?"Add the Shopify keys in Vercel (see README)":(shopify.error||"Couldn't load")};
  })();
  const kpis=[
    {label:"Booked in total",value:kr(bookedTotal),delta:collabs.filter(c=>c.finStatus==="Booked").length+" booked collabs",dc:"var(--ink-2)",sub:"All-time, across every month"},
    {label:"Booked this month",value:kr(bookedThisMonth),delta:momBooked===null?"No comparison":(momBooked>=0?"+":"")+momBooked+"% vs "+MONTHS[prev.getMonth()],dc:momBooked!==null&&momBooked<0?"var(--muted)":"var(--ink)",
      sub:bookedSubParts.length?bookedSubParts.join(" · "):"Nothing paid or invoiced yet"},
    {label:"Steph's cut",value:kr(stephCut),delta:stephCollabCount+" collabs",dc:"var(--ink-2)",sub:"10% of Steph's collabs"},
    shopifyTile
  ];

  // chart -- runs from August (the most recent one on or before today)
  // through the current month, growing by one point each month that passes.
  const months=[];
  {
    const startYear=t.getMonth()>=7?t.getFullYear():t.getFullYear()-1;
    const span=(t.getFullYear()-startYear)*12+(t.getMonth()-7);
    for(let i=span;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:MONTHS[d.getMonth()].slice(0,3)})}
  }
  const values=months.map(x=>monthRevenue(x.y,x.m,["Booked"]));
  const top=30,bottom=160,plot=bottom-top,vbH=186;
  const maxVal=Math.max(goal,...values)*1.16||1;
  const yFor=v=>bottom-(v/maxVal)*plot;
  const xFor=i=>30+i*((700-30)/Math.max(1,months.length-1));
  const pts=values.map((v,i)=>({x:xFor(i),y:yFor(v)}));
  let path="M"+pts[0].x.toFixed(1)+","+pts[0].y.toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    path+=" C"+(p1.x+(p2.x-p0.x)/6).toFixed(1)+","+(p1.y+(p2.y-p0.y)/6).toFixed(1)+" "+(p2.x-(p3.x-p1.x)/6).toFixed(1)+","+(p2.y-(p3.y-p1.y)/6).toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1);
  }
  const area=path+" L"+pts[pts.length-1].x.toFixed(1)+","+bottom+" L"+pts[0].x.toFixed(1)+","+bottom+" Z";
  const goalTop=yFor(goal);

  // ---- To do: Today / This week / Later ----
  // Everything auto-generated here is computed from the shared deal data
  // (collabs, deliverables, contacts) at render time, so every login sees
  // the same list and nothing can be left over or duplicated. Only
  // hand-written tasks are stored rows; their due date lives in the existing
  // "group" column as an ISO date (legacy group names count as undated),
  // which avoids needing a schema change.
  const addDays=(iso,n)=>{const d=parse(iso);return isoOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))};
  const WEEK_END=addDays(TODAY,6);
  const BUCKETS=[["today","Today"],["week","This week"],["later","Later"]];
  const bucketDate={today:TODAY,week:WEEK_END,later:addDays(TODAY,14)};
  const bucketOf=iso=>!iso?"later":iso<=TODAY?"today":iso<=WEEK_END?"week":"later";
  const taskDue=x=>/^\d{4}-\d{2}-\d{2}$/.test(x.group||"")?x.group:"";
  const dueLabel=iso=>{
    if(!iso||iso===TODAY)return "";
    const base=parse(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    return iso<TODAY?"Overdue · "+base:base;
  };
  // Only three things are generated automatically: filming (shoot date),
  // publishing (publish date) and sending the invoice (stage). Dated ones
  // cover the current month only -- earlier months aren't surfaced as overdue.
  const thisMonth=TODAY.slice(0,7);
  const MONTH_END=isoOf(new Date(parse(TODAY).getFullYear(),parse(TODAY).getMonth()+1,0));
  // An automatic task has no row of its own, so removing or rescheduling one
  // is remembered in a small shared "ov-<key>" row in the tasks table:
  // done=true means removed, group=<date> means moved to that date.
  const ovOf=key=>tasks.find(t=>t.id==="ov-"+key);
  const setOverride=(key,fields,delay=0)=>{
    const id="ov-"+key;
    if(ovOf(key))api.patch("tasks",id,fields,delay);
    else api.add("tasks",{id,group:"",title:"",meta:"",done:false,collabId:"",...fields});
  };
  const liveCollabs=collabs.filter(c=>!c.archived);
  const derived=[];
  liveCollabs.forEach(c=>{
    if(c.stage==="Send invoice"){
      const key="inv-"+c.id,ov=ovOf(key);
      derived.push({key,kind:"Invoice",title:"Send invoice to "+c.brand,meta:kr(dkk(c)),due:(ov&&taskDue(ov))||TODAY,collabId:c.id,
        complete:()=>api.patch("collabs",c.id,{stage:"Invoice sent",finStatus:"Invoiced"},0),
        move:iso=>setOverride(key,{group:iso})});
    }
    // Stage "To do" is a manual flag: setting it puts the collab on the list.
    // Ticking it off sends the collab on to "Waiting on brand".
    if(c.stage==="To do"){
      const key="td-"+c.id,ov=ovOf(key);
      const firstNote=(c.notes||c.pitch||"").split("\n")[0];
      derived.push({key,kind:"To do",title:c.brand,meta:firstNote,due:(ov&&taskDue(ov))||TODAY,collabId:c.id,
        complete:()=>api.patch("collabs",c.id,{stage:"Waiting on brand"},0),
        move:iso=>setOverride(key,{group:iso})});
    }
  });
  deliverables.forEach(d=>{
    const c=liveCollabs.find(x=>x.id===d.collabId);
    if(!c||c.finStatus==="Potential")return;
    const si=DSTATUS.indexOf(d.status);
    const name=c.brand+" — "+d.name;
    const meta=d.platform+" · "+d.type;
    if(d.shootDate&&d.shootDate.slice(0,7)===thisMonth&&si<=DSTATUS.indexOf("Shooting"))derived.push({key:"f-"+d.id,kind:"Film",title:"Film "+name,meta,due:d.shootDate,collabId:c.id,
      complete:()=>api.patch("deliverables",d.id,{status:"Editing"},0),
      move:iso=>api.patch("deliverables",d.id,{shootDate:iso},0)});
    if(d.publishDate&&d.publishDate.slice(0,7)===thisMonth&&d.status!=="Published")derived.push({key:"p-"+d.id,kind:"Publish",title:"Publish "+name,meta,due:d.publishDate,collabId:c.id,
      complete:()=>api.patch("deliverables",d.id,{status:"Published"},0),
      move:iso=>api.patch("deliverables",d.id,{publishDate:iso},0)});
  });
  // Hand-written tasks: only ones created since the clean slate (TASKS_SINCE);
  // older stored rows, including the legacy auto-created "inv-"/"cd-" ones and
  // the "ov-" override rows above, stay out of view.
  const manualTasks=tasks.filter(x=>!x.archived&&(x.createdAt||0)>=TASKS_SINCE&&!/^(inv|cd|ov)-/.test(x.id));
  const todoItems={today:[],week:[],later:[]};
  // Edited wording lives in the same override row (title/meta); " " means
  // "blanked on purpose", empty means "use the automatic text".
  const ovText=(o,field,dflt)=>o&&o[field]?(o[field]===" "?"":o[field]):dflt;
  derived.forEach(x=>{
    const o=ovOf(x.key);
    if(o&&o.done)return;
    todoItems[bucketOf(x.due)].push({...x,title:ovText(o,"title",x.title),meta:ovText(o,"meta",x.meta),manual:false,isDone:false});
  });
  manualTasks.forEach(x=>{const due=taskDue(x);todoItems[bucketOf(due)].push({...x,key:x.id,manual:true,due,isDone:!!x.done})});
  Object.values(todoItems).forEach(list=>list.sort((a,b)=>(a.isDone?1:0)-(b.isDone?1:0)||(a.due||"9999").localeCompare(b.due||"9999")||(a.title||"").localeCompare(b.title||"")));
  const openCount=bk=>todoItems[bk].filter(x=>!x.isDone).length;
  // Dropping a task on a column reschedules it: hand-written tasks get that
  // column's date; Film/Publish move the reel's real shoot/publish date
  // (kept inside this month so it doesn't vanish from the list); Send invoice
  // is snoozed via its override row.
  const dropOnBucket=bk=>e=>{
    e.preventDefault();
    const d=p.drag.current;
    p.setDropTarget(null);
    const item=d&&d.kind==="task"?[...todoItems.today,...todoItems.week,...todoItems.later].find(i=>i.key===d.id):null;
    if(item){
      const iso=bucketDate[bk];
      if(item.manual)api.patch("tasks",item.id,{group:iso},0);
      else item.move(iso>MONTH_END?MONTH_END:iso);
    }
    p.drag.current=null;
  };

  return html`<div className="page">
    <div className="title-row">
      <h1>${pageTitle}</h1>
      <span style=${{fontSize:13,color:"var(--muted)"}}>${boardScoped.length} collaborations in view</span>
      <div style=${{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div className="pills">
          ${["Last month","This month","Next month","This year","All time"].map(x=>html`<button key=${x} type="button" className=${"pill"+(period===x?" on":"")} onClick=${()=>setPeriod(x)}>${x}</button>`)}
        </div>
        <input type="month" aria-label="Pick a specific month" className="sel-box" value=${monthPick?period:""} onChange=${val(v=>{if(v)setPeriod(v)})}/>
      </div>
    </div>

    ${showFinance&&html`<div>
      <section className="kpis">
        ${kpis.map(k=>html`<div key=${k.label} className="card kpi">
          <div className="kicker">${k.label}</div>
          <div className="kpi-val num">${k.value}</div>
          <div className="kpi-delta" style=${{color:k.dc}}>${k.delta}</div>
          <div className="kpi-sub">${k.sub}</div>
        </div>`)}
      </section>
      <section className="chart-row">
        <div className="card chart-card">
          <div style=${{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap",marginBottom:2}}>
            <h3 style=${{fontSize:15,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>Booked month after month</h3>
            <span style=${{fontSize:12.5,color:"var(--muted)"}}>Since August, in DKK</span>
            <div style=${{marginLeft:"auto",display:"flex",alignItems:"baseline",gap:10}}>
              <span className="num" style=${{fontSize:20,fontWeight:700,letterSpacing:"-.03em",color:momBooked!==null&&momBooked<0?"var(--muted)":"var(--ink)"}}>${momBooked===null?"—":(momBooked>=0?"+":"")+momBooked+"%"}</span>
              <span style=${{fontSize:12.5,color:"var(--ink-2)"}}>${momBooked===null?"no comparison with "+MONTHS[prev.getMonth()]:kr(Math.abs(bookedThisMonth-bookedLastMonth))+(bookedThisMonth>=bookedLastMonth?" more than ":" less than ")+MONTHS[prev.getMonth()]}</span>
            </div>
          </div>
          <div style=${{position:"relative",height:186,marginTop:4}}>
            <svg viewBox="0 0 720 186" preserveAspectRatio="none" style=${{position:"absolute",inset:0,width:"100%",height:"100%",display:"block"}} aria-hidden="true">
              <path d=${area} fill="var(--fill)"></path>
              <path d=${"M20,"+goalTop.toFixed(1)+" L700,"+goalTop.toFixed(1)} fill="none" stroke="var(--dash)" strokeWidth="1" strokeDasharray="4 5" vectorEffect="non-scaling-stroke"></path>
              <path d=${path} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"></path>
            </svg>
            <span style=${{position:"absolute",right:0,top:(goalTop/vbH*100).toFixed(2)+"%",transform:"translateY(-135%)",fontSize:10.5,color:"var(--muted)",whiteSpace:"nowrap"}}>Goal ${kr(goal)}</span>
            ${months.map((x,i)=>{const cur=i===months.length-1;const size=cur?10:8;return html`<span key=${i} style=${{position:"absolute",left:(pts[i].x/720*100).toFixed(2)+"%",top:(pts[i].y/vbH*100).toFixed(2)+"%",width:0,height:0}}>
              <span style=${{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:size,height:size,borderRadius:"50%",border:"2px solid var(--ink)",background:cur?"var(--ink)":"var(--surface)"}}></span>
              <span className="num" style=${{position:"absolute",left:"50%",top:-14,transform:"translate(-50%,-100%)",fontSize:11,fontWeight:cur?600:400,color:cur?"var(--ink)":"var(--muted)",whiteSpace:"nowrap"}}>${values[i]>0?krShort(values[i]):"0"}</span>
            </span>`})}
          </div>
          <div style=${{position:"relative",height:26}}>
            ${months.map((x,i)=>{const cur=i===months.length-1;return html`<span key=${i} style=${{position:"absolute",left:(pts[i].x/720*100).toFixed(2)+"%",top:4,transform:"translateX(-50%)",fontSize:11.5,fontWeight:cur?600:400,color:cur?"var(--ink)":"var(--muted)",whiteSpace:"nowrap"}}>${x.label}</span>`})}
          </div>
        </div>

        <div className="card goal-card">
          <div className="kicker" style=${{alignSelf:"stretch"}}>Booked vs goal</div>
          <div style=${{position:"relative",width:158,height:158,margin:"18px 0 14px"}}>
            <svg viewBox="0 0 80 80" width="158" height="158" style=${{display:"block",transform:"rotate(-90deg)"}} aria-hidden="true">
              <circle cx="40" cy="40" r="33" fill="none" stroke="var(--hot)" strokeWidth="7"></circle>
              <circle cx="40" cy="40" r="33" fill="none" stroke="var(--ink)" strokeWidth="7" strokeLinecap="round" strokeDasharray=${(RING*Math.min(1,pct/100)).toFixed(1)+" "+RING.toFixed(1)}></circle>
            </svg>
            <div style=${{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <span className="num" style=${{fontSize:34,fontWeight:700,letterSpacing:"-.04em",lineHeight:1}}>${pct}%</span>
              <span className="num" style=${{fontSize:12,color:"var(--muted)",marginTop:4}}>${kr(secured)}</span>
            </div>
          </div>
          <div style=${{alignSelf:"stretch",paddingTop:14,borderTop:"1px solid var(--line)",display:"flex",alignItems:"baseline",gap:4}}>
            <label htmlFor="goal-in" style=${{fontSize:12.5,color:"var(--ink-2)"}}>of</label>
            <input id="goal-in" type="number" step="1000" min="0" className="goal-input num" title="Monthly goal in DKK" value=${goal} onChange=${val(v=>api.settings({goal:Number(v)||0}))}/>
            <span style=${{fontSize:12.5,color:"var(--ink-2)"}}>kr</span>
            <span className="num" style=${{marginLeft:"auto",fontSize:12.5,fontWeight:500,whiteSpace:"nowrap"}}>${pct>=100?"Goal reached":kr(goal-secured)+" to go"}</span>
          </div>
        </div>
      </section>
    </div>`}

    ${showToday&&html`<section className="todo">
      <div style=${{display:"flex",alignItems:"baseline",gap:12,marginBottom:14,flexWrap:"wrap"}}>
        <h2 style=${{fontSize:22,fontWeight:700,margin:0,letterSpacing:"-.035em"}}>To do</h2>
        <span style=${{fontSize:14,color:"var(--muted)"}}>${openCount("today")} for today · ${openCount("week")} this week</span>
      </div>
      <div className="todo-grid">
        ${BUCKETS.map(([bk,label])=>html`<div key=${bk} onDragOver=${p.allowDrop("todo:"+bk)} onDragLeave=${p.leaveDrop("todo:"+bk)} onDrop=${dropOnBucket(bk)}
            style=${{minHeight:90,borderRadius:14,padding:"6px 8px 8px",margin:"-6px -8px -8px",background:p.dropTarget==="todo:"+bk?"var(--hot)":"transparent"}}>
          <div style=${{display:"flex",alignItems:"baseline",gap:8,fontSize:12,fontWeight:500,letterSpacing:".14em",textTransform:"uppercase",color:"var(--muted)",marginBottom:10}}>
            <span>${label}</span><span className="num" style=${{letterSpacing:0,color:"var(--faint)"}}>${openCount(bk)}</span>
          </div>
          ${todoItems[bk].map(x=>x.manual?html`<div key=${x.key} className="task" draggable="true" onDragStart=${p.startDrag("task",x.key)} onDragEnd=${p.endDrag}>
            <span aria-hidden="true" title="Drag to move" style=${{flex:"none",paddingTop:3,color:"var(--dash-2)",cursor:"grab",fontSize:13,letterSpacing:"-2px",userSelect:"none"}}>⋮⋮</span>
            <button type="button" className=${"check"+(x.isDone?" done":"")} aria-label=${x.isDone?"Mark as not done":"Mark as done"} onClick=${()=>api.patch("tasks",x.id,{done:!x.isDone},0)}></button>
            <div style=${{flex:1,minWidth:0}}>
              <input id=${"task-t-"+x.id} className="quiet" aria-label="Task" value=${x.title} onChange=${val(v=>api.patch("tasks",x.id,{title:v}))}
                style=${{display:"block",width:"100%",fontSize:15,fontWeight:500,letterSpacing:"-.018em",color:x.isDone?"var(--muted)":"var(--ink)",textDecoration:x.isDone?"line-through":"none"}}/>
              <div style=${{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                <input id=${"task-m-"+x.id} className="quiet" aria-label="Details" placeholder="Add details" value=${x.meta||""} onChange=${val(v=>api.patch("tasks",x.id,{meta:v}))}
                  style=${{flex:1,minWidth:90,fontSize:13,color:x.isDone?"var(--dash-2)":"var(--muted)",textDecoration:x.isDone?"line-through":"none"}}/>
                <input type="date" aria-label="Due date" className="date-in num" value=${x.due} onChange=${val(v=>api.patch("tasks",x.id,{group:v},0))} style=${{width:112,flex:"none",fontSize:11.5,padding:"1px 4px"}}/>
                ${x.collabId&&collabs.some(c=>c.id===x.collabId)&&html`<button type="button" onClick=${()=>setOpen(x.collabId)} style=${{flex:"none",background:"transparent",border:0,padding:0,fontSize:11.5,color:"var(--muted)",textDecoration:"underline",textUnderlineOffset:2}}>Open</button>`}
                ${x.isDone&&html`<button type="button" onClick=${()=>api.patch("tasks",x.id,{archived:true},0)} style=${{flex:"none",background:"transparent",border:0,padding:0,fontSize:11.5,color:"var(--muted)",textDecoration:"underline",textUnderlineOffset:2}}>Archive</button>`}
              </div>
            </div>
            <button type="button" className="x" aria-label="Delete task" onClick=${()=>askDelete("Delete this task?","“"+x.title+"” will be removed from To do.",()=>api.remove([["tasks",x.id]]))}>✕</button>
          </div>`:html`<div key=${x.key} className="task" draggable="true" onDragStart=${p.startDrag("task",x.key)} onDragEnd=${p.endDrag}>
            <span aria-hidden="true" title="Drag to reschedule" style=${{flex:"none",paddingTop:3,color:"var(--dash-2)",cursor:"grab",fontSize:13,letterSpacing:"-2px",userSelect:"none"}}>⋮⋮</span>
            <button type="button" className="check" aria-label=${"Mark done: "+x.title} title="Mark done" onClick=${x.complete}></button>
            <div style=${{flex:1,minWidth:0}}>
              <input id=${"task-t-"+x.key} className="quiet" aria-label="Task" title="Edit wording (only changes this to-do)" value=${x.title} onChange=${val(v=>setOverride(x.key,{title:v===""?" ":v},450))}
                style=${{display:"block",width:"100%",fontSize:15,fontWeight:500,letterSpacing:"-.018em"}}/>
              <div style=${{display:"flex",alignItems:"baseline",gap:6}}>
                <span className="kicker" style=${{flex:"none"}}>${x.kind}</span>
                ${dueLabel(x.due)&&html`<span style=${{flex:"none",fontSize:13,color:"var(--muted)"}}>${dueLabel(x.due)}</span>`}
                <input id=${"task-m-"+x.key} className="quiet" aria-label="Details" placeholder="Add details" value=${x.meta||""} onChange=${val(v=>setOverride(x.key,{meta:v===""?" ":v},450))}
                  style=${{flex:1,minWidth:60,fontSize:13,color:"var(--muted)"}}/>
                <button type="button" onClick=${()=>setOpen(x.collabId)} style=${{flex:"none",background:"transparent",border:0,padding:0,fontSize:11.5,color:"var(--muted)",textDecoration:"underline",textUnderlineOffset:2}}>Open</button>
              </div>
            </div>
            <button type="button" className="x" aria-label=${"Remove: "+x.title} title="Remove from to-do" onClick=${()=>askDelete("Remove this task?","“"+x.title+"” will be taken off everyone's To do. The "+(x.kind==="Invoice"||x.kind==="To do"?"collaboration":"reel")+" itself isn't changed.",()=>setOverride(x.key,{done:true}))}>✕</button>
          </div>`)}
          ${todoItems[bk].length===0&&html`<span style=${{fontSize:13,color:"var(--faint)"}}>Nothing here</span>`}
          <button type="button" className="add-row" onClick=${()=>api.add("tasks",{id:uid("t"),group:bucketDate[bk],title:"New task",meta:"",done:false,collabId:""})}>
            <span className="add-dot">+</span><span>Add task</span></button>
        </div>`)}
      </div>
    </section>`}

    <section className="kanban-wrap">
      <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
        <h2 style=${{fontSize:22,fontWeight:700,margin:0,letterSpacing:"-.035em"}}>${boardView==="deals"?"Deals by month":"Pipeline"}</h2>
        <span style=${{fontSize:13,color:"var(--muted)"}}>${collabs.filter(c=>!c.archived).length} collaborations</span>
        <div className="pills" style=${{marginLeft:"auto",padding:4}}>
          ${[["pipeline","Pipeline"],["deals","Deals by month"]].map(([k,l])=>html`<button key=${k} type="button" className=${"pill"+(boardView===k?" on":"")} onClick=${()=>setBoardView(k)}>${l}</button>`)}
        </div>
      </div>
      ${boardView==="deals"?html`<${DealsBoard} ...${p}/>`:html`<section className="kanban">
      ${KAN.map(col=>{
        const stagePriority=c=>c.stage==="To do"||c.stage==="Send a brief"||c.stage==="Need to respond"?0:c.stage==="Waiting on brand"?2:1;
        const list=collabs.filter(c=>!c.archived&&c.kanban===col).sort((a,b)=>stagePriority(a)-stagePriority(b));
        return html`<div key=${col} className=${"col"+(p.dropTarget==="col:"+col?" hot":"")} onDragOver=${p.allowDrop("col:"+col)} onDragLeave=${p.leaveDrop("col:"+col)}
          onDrop=${e=>{e.preventDefault();const d=p.drag.current;p.setDropTarget(null);if(d&&d.kind==="collab"){const cc=p.st.collabs.find(x=>x.id===d.id);if(cc)p.setKanban(cc,col)}p.drag.current=null}}>
          <div style=${{display:"flex",alignItems:"baseline",gap:9,padding:"0 2px 12px"}}>
            <h3 style=${{fontSize:14,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>${col}</h3>
            <span className="num" style=${{fontSize:12,color:"var(--faint)"}}>${list.length}</span>
            <span className="num" style=${{marginLeft:"auto",fontSize:12,color:"var(--ink-2)"}}>${kr(list.reduce((a,c)=>a+dkk(c),0))}</span>
          </div>
          <div style=${{display:"flex",flexDirection:"column",gap:10}}>
            ${list.map(c=>html`<${KanbanCard} key=${c.id} c=${c} ...${p}/>`)}
            ${list.length===0&&html`<div className="empty-drop">Drag a collaboration here</div>`}
            <button type="button" className="add-collab" onClick=${()=>p.newCollab(col)}>+ Add collaboration</button>
          </div>
        </div>`;
      })}
      </section>`}
    </section>
  </div>`;
}

/* Stage menu shared by the pipeline cards and the deals-by-month cards, so the
   two views offer exactly the same stages (plus a one-click Archive). */
function StageRow({c,id,setStage,api,style}){
  const urgent=URGENT.includes(c.stage);
  return html`<div style=${{display:"flex",alignItems:"center",gap:7,...style}}>
    <span style=${{width:6,height:6,borderRadius:"50%",flex:"none",background:urgent?"var(--ink)":"var(--dash-2)"}}></span>
    <select id=${id} aria-label="Stage" className="qsel" value=${c.stage} onClick=${stop} onChange=${val(v=>setStage(c,v))}
      style=${{color:urgent?"var(--ink)":"var(--muted)",fontWeight:urgent?500:400}}><${Options} list=${STAGES}/></select>
    <button type="button" className="x" style=${{marginLeft:"auto",width:"auto",padding:"0 7px",fontSize:11,color:"var(--muted)"}} title="Archive this collaboration" aria-label=${"Archive "+c.brand}
      onClick=${e=>{e.stopPropagation();api.patch("collabs",c.id,{archived:true},0)}}>Archive</button>
  </div>`;
}

function KanbanCard(p){
  const {c,st,api,dkk,setOpen,deleteCollab}=p;
  const dels=st.deliverables.filter(d=>d.collabId===c.id);
  const next=dels.filter(d=>d.publishDate).map(d=>d.publishDate).sort()[0];
  return html`<article className="kcard" draggable="true" onDragStart=${p.startDrag("collab",c.id)} onDragEnd=${p.endDrag} onClick=${()=>setOpen(c.id)}>
    <div style=${{display:"flex",alignItems:"baseline",gap:8}}>
      <span style=${{fontSize:15,fontWeight:600,letterSpacing:"-.022em",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${c.brand}</span>
      <span style=${{fontSize:11,color:"var(--faint)"}}>${c.owner}</span>
      <span style=${{marginLeft:"auto",display:"flex",alignItems:"baseline",gap:3}}>
        <input id=${"kp-"+c.id} type="number" aria-label="Price" className="num" value=${c.price} onClick=${stop} onChange=${val(v=>api.patch("collabs",c.id,{price:Number(v)||0}))}
          style=${{width:72,textAlign:"right",background:"transparent",border:0,borderRadius:6,padding:"1px 3px",fontSize:15,fontWeight:600}}/>
        <select id=${"kc-"+c.id} aria-label="Currency" value=${c.currency} onClick=${stop} onChange=${val(v=>api.patch("collabs",c.id,{currency:v},0))} style=${{background:"transparent",border:0,fontSize:11,color:"var(--muted)"}}><${Options} list=${CURRENCIES}/></select>
      </span>
    </div>
    <div className="num" style=${{fontSize:11.5,color:"var(--faint)",textAlign:"right",minHeight:c.currency==="DKK"?0:17}}>${c.currency==="DKK"?"":"≈ "+kr(dkk(c))}</div>
    ${c.pitch&&html`<p className="clamp">${c.pitch}</p>`}
    <${StageRow} c=${c} id=${"ks-"+c.id} setStage=${p.setStage} api=${api} style=${{marginTop:12}}/>
    <div style=${{display:"flex",alignItems:"center",gap:10,marginTop:12,paddingTop:11,borderTop:"1px solid var(--line-2)",fontSize:11.5,color:"var(--muted)"}}>
      <span className="num">${next?"Publishes "+fmtDate(next):"No date yet"}</span>
      <span style=${{marginLeft:"auto"}}>${dels.length}${dels.length===1?" item":" items"}</span>
      <span>${c.finStatus}</span>
      <button type="button" className="x" style=${{width:20,height:20}} aria-label=${"Delete "+c.brand} onClick=${e=>{e.stopPropagation();deleteCollab(c)}}>✕</button>
    </div>
  </article>`;
}

/* ---------- Deals board: one card per deliverable, in a rolling 5-month
   board (today's month + next 4). Shared by the Calendar tab's "Deals"
   pill and the Dashboard's "Deals scheduled" to-do toggle. ---------- */
function DealsBoard(p){
  const {st,api,dkk,setOpen,setTab,askDelete,drag,startDrag,endDrag,allowDrop,leaveDrop,dropTarget,setDropTarget,newDealInMonth}=p;
  const {deliverables,collabs}=st;
  const [cursor,setCursor]=useState(0);
  const openCollab=id=>{setTab("dash");setOpen(id)};
  const dealMonths=[];
  // Current month sits in the middle (2 before, 2 after); arrows slide the window.
  {const td=parse(TODAY);for(let i=0;i<5;i++){const d=new Date(td.getFullYear(),td.getMonth()+cursor+i-2,1);dealMonths.push({y:d.getFullYear(),m:d.getMonth(),label:MONTHS[d.getMonth()]+" "+d.getFullYear(),current:d.getFullYear()===td.getFullYear()&&d.getMonth()===td.getMonth()})}}
  const perReel=d=>{
    const c=collabs.find(x=>x.id===d.collabId);if(!c)return 0;
    const sibs=deliverables.filter(x=>x.collabId===c.id).length||1;
    return Math.round(dkk(c)/sibs);
  };
  const dropOnDealMonth=(y,m)=>e=>{
    e.preventDefault();const d=drag.current;setDropTarget(null);if(!d||d.kind!=="deliverable")return;
    const item=deliverables.find(x=>x.id===d.id);
    const daysInMonth=new Date(y,m+1,0).getDate();
    const day=item&&item.publishDate?Math.min(parse(item.publishDate).getDate(),daysInMonth):1;
    api.patch("deliverables",d.id,{publishDate:isoOf(new Date(y,m,day)),status:!item||item.status==="Idea"?"Scheduled":item.status},0);
    drag.current=null;
  };

  return html`<div>
    <div style=${{display:"flex",gap:6,marginBottom:12}}>
      <button type="button" className="nav-btn" aria-label="Earlier months" onClick=${()=>setCursor(c=>c-1)}>←</button>
      <button type="button" className="nav-btn" style=${{width:"auto",padding:"0 13px",fontSize:12.5}} onClick=${()=>setCursor(0)}>Today</button>
      <button type="button" className="nav-btn" aria-label="Later months" onClick=${()=>setCursor(c=>c+1)}>→</button>
    </div>
    <div className="grid-scroll">
    <div style=${{display:"grid",gridTemplateColumns:"repeat(5,minmax(220px,1fr))",gap:12,minWidth:1120}}>
      ${dealMonths.map(mo=>{
        const items=deliverables.filter(d=>{if(!d.publishDate)return false;const c=collabs.find(x=>x.id===d.collabId);if(!c||c.archived)return false;const dd=parse(d.publishDate);return dd.getFullYear()===mo.y&&dd.getMonth()===mo.m});
        const key="deal:"+mo.y+"-"+mo.m;
        return html`<div key=${mo.label} className=${"col"+(dropTarget===key?" hot":"")} onDragOver=${allowDrop(key)} onDragLeave=${leaveDrop(key)} onDrop=${dropOnDealMonth(mo.y,mo.m)}
            style=${mo.current?{boxShadow:"inset 0 0 0 1.5px var(--ink)",background:dropTarget===key?"var(--hot)":"var(--surface)"}:undefined}>
          <div style=${{display:"flex",alignItems:"baseline",gap:9,padding:"0 2px 12px"}}>
            <h3 style=${{fontSize:14,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>${mo.label}</h3>
            ${mo.current&&html`<span style=${{fontSize:10.5,fontWeight:500,background:"var(--ink)",color:"var(--surface)",borderRadius:999,padding:"1px 8px",alignSelf:"center"}}>This month</span>`}
            <span className="num" style=${{fontSize:12,color:"var(--faint)"}}>${items.length}</span>
            <span className="num" style=${{marginLeft:"auto",fontSize:12,color:"var(--ink-2)"}}>${kr(items.reduce((a,d)=>a+perReel(d),0))}</span>
          </div>
          <div style=${{display:"flex",flexDirection:"column",gap:10}}>
            ${items.length===0&&html`<div className="empty-drop">Drag a reel here</div>`}
            ${items.map(d=>{
              const c=collabs.find(x=>x.id===d.collabId);
              if(!c)return "";
              const sibs=deliverables.filter(x=>x.collabId===c.id).length||1;
              return html`<article key=${d.id} className="kcard" draggable="true" onDragStart=${startDrag("deliverable",d.id)} onDragEnd=${endDrag} onClick=${()=>openCollab(c.id)}>
                <div style=${{display:"flex",alignItems:"baseline",gap:8}}>
                  <span style=${{fontSize:14,fontWeight:600,letterSpacing:"-.02em",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${c.brand}</span>
                  <span className="num" style=${{marginLeft:"auto",fontSize:15,fontWeight:700,whiteSpace:"nowrap"}}>${kr(Math.round(dkk(c)/sibs))}</span>
                </div>
                <div style=${{display:"flex",alignItems:"baseline",justifyContent:"flex-end",gap:3,fontSize:11,color:"var(--faint)"}}>
                  <span>of</span>
                  <input type="number" aria-label="Total collab price" className="num" value=${c.price} onClick=${stop} onChange=${val(v=>api.patch("collabs",c.id,{price:Number(v)||0}))}
                    style=${{width:56,textAlign:"right",background:"transparent",border:0,borderRadius:6,padding:"1px 2px",fontSize:11,color:"var(--faint)"}}/>
                  <select aria-label="Currency" value=${c.currency} onClick=${stop} onChange=${val(v=>api.patch("collabs",c.id,{currency:v},0))} style=${{background:"transparent",border:0,fontSize:11,color:"var(--faint)"}}><${Options} list=${CURRENCIES}/></select>
                  <span>total${sibs>1?" · "+sibs+" reels":""}</span>
                </div>
                <input aria-label="Deliverable name" className="quiet" value=${d.name} onClick=${stop} onChange=${val(v=>api.patch("deliverables",d.id,{name:v}))} style=${{display:"block",width:"100%",fontSize:12.5,margin:"6px 0 0",marginLeft:-4,padding:"1px 4px"}}/>
                <${StageRow} c=${c} setStage=${p.setStage} api=${api} style=${{marginTop:8}}/>
                <div style=${{display:"flex",alignItems:"center",gap:6,marginTop:8,paddingTop:8,borderTop:"1px solid var(--line-2)"}}>
                  <select aria-label="Platform" value=${d.platform} onClick=${stop} onChange=${val(v=>api.patch("deliverables",d.id,{platform:v},0))} style=${{border:0,background:"transparent",fontSize:11,color:"var(--muted)"}}><${Options} list=${PLATFORMS}/></select>
                  <select aria-label="Status" value=${d.status} onClick=${stop} onChange=${val(v=>api.patch("deliverables",d.id,{status:v},0))} style=${{border:0,background:"transparent",fontSize:11,color:"var(--muted)",marginLeft:"auto"}}><${Options} list=${DSTATUS}/></select>
                  <button type="button" className="x" style=${{width:18,height:18,fontSize:11}} aria-label="Delete deliverable" onClick=${e=>{e.stopPropagation();askDelete("Delete this deliverable?","“"+d.name+"” will be removed.",()=>api.remove([["deliverables",d.id],["tasks","cd-"+d.id]]))}}>✕</button>
                </div>
              </article>`;
            })}
            <button type="button" className="add-collab" onClick=${()=>newDealInMonth(mo.y,mo.m)}>+ Add deal</button>
          </div>
        </div>`;
      })}
    </div>
    </div>
  </div>`;
}

/* ---------- Calendar ---------- */
function Calendar(p){
  const {st,api,brandOf,dkk,calMode,setCalMode,cursor,setCursor,sidebar,setSidebar,openQuick,setOpen,setTab,askDelete,drag,setDropTarget,dropTarget}=p;
  const {deliverables,ideas,collabs}=st;
  const cur=parse(cursor);
  const weekStart=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-((cur.getDay()+6)%7));
  const step=n=>()=>setCursor(isoOf(calMode==="Week"?new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7*n):new Date(cur.getFullYear(),cur.getMonth()+n,1)));
  const openCollab=id=>{setTab("dash");setOpen(id)};

  const dropOnDate=iso=>e=>{
    e.preventDefault();const d=drag.current;setDropTarget(null);if(!d)return;
    if(d.kind==="deliverable"){const x=deliverables.find(o=>o.id===d.id);api.patch("deliverables",d.id,{publishDate:iso,status:!x||x.status==="Idea"?"Scheduled":x.status},0)}
    if(d.kind==="idea")api.patch("ideas",d.id,{scheduledDate:iso},0);
    drag.current=null;
  };
  const dropOnSidebar=e=>{
    e.preventDefault();const d=drag.current;setDropTarget(null);if(!d)return;
    if(d.kind==="deliverable")api.patch("deliverables",d.id,{publishDate:""},0);
    if(d.kind==="idea")api.patch("ideas",d.id,{scheduledDate:""},0);
    drag.current=null;
  };

  let start,count;
  if(calMode==="Week"){start=weekStart;count=7}
  else{const first=new Date(cur.getFullYear(),cur.getMonth(),1);start=new Date(cur.getFullYear(),cur.getMonth(),1-((first.getDay()+6)%7));count=42}
  const cells=[];
  for(let i=0;i<count;i++){
    const day=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const iso=isoOf(day);
    const items=[];
    deliverables.filter(d=>d.publishDate===iso).forEach(d=>items.push({key:d.id,kind:"deliverable",icon:html`<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><rect x="0.5" y="0.5" width="7" height="7" rx="1.5" fill="var(--ink)"/></svg>`,title:brandOf(d.collabId)+" — "+d.name,onClick:e=>{e.stopPropagation();openCollab(d.collabId)},onDelete:()=>askDelete("Delete this deliverable?","“"+d.name+"” will be removed from "+brandOf(d.collabId)+" and from the calendar.",()=>api.remove([["deliverables",d.id],["tasks","cd-"+d.id]]))}));
    ideas.filter(x=>x.scheduledDate===iso).forEach(x=>items.push({key:x.id,kind:"idea",icon:html`<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="none" stroke="var(--ink)" stroke-width="1.3"/></svg>`,title:x.title,onClick:e=>e.stopPropagation(),onDelete:()=>askDelete("Delete this idea?","“"+x.title+"” will be removed.",()=>api.remove([["ideas",x.id]]))}));
    cells.push({iso,num:day.getDate(),dim:calMode==="Month"&&day.getMonth()!==cur.getMonth(),today:iso===TODAY,items});
  }
  if(calMode==="Month"){while(cells.length>35&&cells.slice(-7).every(c=>c.dim))cells.splice(-7)}

  const monthStart=isoOf(new Date(cur.getFullYear(),cur.getMonth(),1));
  const rows=[];
  deliverables.filter(d=>d.publishDate&&d.publishDate>=monthStart).forEach(d=>rows.push({key:d.id,sort:d.publishDate,title:brandOf(d.collabId)+" — "+d.name,meta:d.platform+" · "+d.type,status:d.status,onClick:()=>openCollab(d.collabId)}));
  ideas.filter(x=>x.scheduledDate&&x.scheduledDate>=monthStart).forEach(x=>rows.push({key:x.id,sort:x.scheduledDate,title:x.title,meta:x.platform+" · "+x.type,status:"Idea",onClick:()=>{}}));
  rows.sort((a,b)=>a.sort.localeCompare(b.sort));

  const unsD=deliverables.filter(d=>!d.publishDate);
  const unsI=ideas.filter(x=>!x.scheduledDate);

  return html`<div className="cal-wrap">
    <div className="cal-main">
      <div style=${{display:"flex",alignItems:"center",gap:14,marginBottom:14,flexWrap:"wrap"}}>
        <h2 style=${{fontSize:24,fontWeight:700,margin:0,minWidth:190,letterSpacing:"-.035em"}}>${calMode==="Deals"?"Deals by month":calMode==="Week"?"Week of "+fmtDate(isoOf(weekStart)):calMode==="List"?"From "+MONTHS[cur.getMonth()]+" "+cur.getFullYear():MONTHS[cur.getMonth()]+" "+cur.getFullYear()}</h2>
        ${calMode!=="Deals"&&html`<div style=${{display:"flex",gap:6}}>
          <button type="button" className="nav-btn" aria-label="Previous" onClick=${step(-1)}>←</button>
          <button type="button" className="nav-btn" aria-label="Next" onClick=${step(1)}>→</button>
          <button type="button" className="nav-btn" style=${{width:"auto",padding:"0 13px",fontSize:12.5}} onClick=${()=>setCursor(TODAY)}>Today</button>
        </div>`}
        <div className="pills" style=${{marginLeft:"auto",padding:4}}>
          ${["Month","Week","List","Deals"].map(m=>html`<button key=${m} type="button" className=${"pill"+(calMode===m?" on":"")} onClick=${()=>setCalMode(m)}>${m}</button>`)}
        </div>
      </div>

      ${calMode==="Deals"?html`<${DealsBoard} ...${p}/>`:calMode!=="List"?html`<div className="card grid-scroll" style=${{padding:"16px 18px 18px"}}>
        <div className="grid7" style=${{marginBottom:8}}>${DAYNAMES.map(d=>html`<span key=${d} className="kicker" style=${{paddingLeft:4}}>${d}</span>`)}</div>
        <div className="grid7">
          ${cells.map(c=>html`<div key=${c.iso} className=${"cell"+(dropTarget==="date:"+c.iso?" hot":"")}
              style=${{minHeight:calMode==="Week"?340:112,opacity:c.dim?.45:1}}
              onClick=${()=>openQuick(c.iso)} onDragOver=${p.allowDrop("date:"+c.iso)} onDragLeave=${p.leaveDrop("date:"+c.iso)} onDrop=${dropOnDate(c.iso)}>
            <div style=${{marginBottom:6}}>
              <span className="num" style=${c.today?{fontSize:11.5,background:"var(--ink)",color:"var(--surface)",borderRadius:999,padding:"2px 7px",fontWeight:500}:{fontSize:11.5,color:"var(--muted)"}}>${c.num}</span>
            </div>
            <div style=${{display:"flex",flexDirection:"column",gap:5}}>
              ${c.items.map(it=>html`<div key=${it.key} className=${"chip"+(it.kind==="idea"?" idea":"")} draggable="true" title=${it.title}
                  onDragStart=${p.startDrag(it.kind,it.key)} onDragEnd=${p.endDrag} onClick=${it.onClick}>
                <span style=${{flex:"none",display:"flex",alignItems:"center"}}>${it.icon}</span><span className="chip-t">${it.title}</span>
                <button type="button" className="x" style=${{flex:"none",width:14,height:14,fontSize:9}} aria-label=${"Remove "+it.title} onClick=${e=>{e.stopPropagation();it.onDelete()}}>✕</button>
              </div>`)}
            </div>
          </div>`)}
        </div>
      </div>`:html`<div className="card" style=${{padding:"6px 20px 14px"}}>
        ${rows.length===0&&html`<p style=${{color:"var(--muted)",fontSize:13,padding:"14px 8px",margin:0}}>Nothing scheduled from here on.</p>`}
        ${rows.map(r=>html`<div key=${r.key} className="list-row" onClick=${r.onClick}>
          <span className="num" style=${{fontSize:12,color:"var(--ink-2)"}}>${parse(r.sort).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span>
          <span style=${{fontSize:13.5}}>${r.title}</span>
          <span className="lr-meta" style=${{fontSize:12,color:"var(--muted)"}}>${r.meta}</span>
          <span style=${{fontSize:11.5,borderRadius:999,padding:"3px 10px",justifySelf:"start",background:r.status==="Published"?"var(--bg)":"var(--ink)",color:r.status==="Published"?"var(--muted)":"var(--surface)"}}>${r.status}</span>
        </div>`)}
      </div>`}
    </div>

    <aside className=${"side"+(dropTarget==="side"?" hot":"")} style=${{width:sidebar?294:50}} onDragOver=${p.allowDrop("side")} onDragLeave=${p.leaveDrop("side")} onDrop=${dropOnSidebar}>
      ${sidebar?html`<div style=${{padding:"20px 20px 36px"}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <h3 style=${{fontSize:15,fontWeight:600,margin:0,letterSpacing:"-.018em"}}>Unscheduled</h3>
          <button type="button" className="nav-btn" style=${{marginLeft:"auto",width:26,height:26,borderRadius:8,fontSize:12}} aria-label="Collapse" onClick=${()=>setSidebar(false)}>→</button>
        </div>
        <p style=${{fontSize:12,color:"var(--muted)",margin:"0 0 18px"}}>Drag onto a date to schedule it. Drag back here to unschedule.</p>
        <div className="kicker" style=${{marginBottom:10}}>Deliverables</div>
        <div style=${{display:"flex",flexDirection:"column",gap:7,marginBottom:22}}>
          ${unsD.map(d=>html`<div key=${d.id} className="uns" draggable="true" onDragStart=${p.startDrag("deliverable",d.id)} onDragEnd=${p.endDrag} onClick=${()=>openCollab(d.collabId)}>
            <span style=${{display:"block",fontSize:12.5}}>${brandOf(d.collabId)} — ${d.name}</span>
            <span style=${{display:"block",fontSize:11,color:"var(--muted)"}}>${d.platform} · ${d.type}</span></div>`)}
          ${unsD.length===0&&html`<span style=${{fontSize:12,color:"var(--muted)"}}>All scheduled.</span>`}
        </div>
        <div className="kicker" style=${{marginBottom:10}}>Content ideas</div>
        <div style=${{display:"flex",flexDirection:"column",gap:7,marginBottom:10}}>
          ${unsI.map(x=>html`<div key=${x.id} className="uns-idea" draggable="true" onDragStart=${p.startDrag("idea",x.id)} onDragEnd=${p.endDrag}>
            <div style=${{display:"flex",alignItems:"flex-start",gap:6}}>
              <input id=${"it-"+x.id} aria-label="Idea title" className="quiet quiet-w" value=${x.title} onChange=${val(v=>api.patch("ideas",x.id,{title:v}))} style=${{flex:1,minWidth:0,fontSize:12.5,marginLeft:-3,padding:"1px 3px"}}/>
              <button type="button" className="x" style=${{width:18,height:18,fontSize:11}} aria-label="Delete idea" onClick=${()=>askDelete("Delete this idea?","“"+x.title+"” will be removed.",()=>api.remove([["ideas",x.id]]))}>✕</button>
            </div>
            <input id=${"ih-"+x.id} aria-label="Hook" placeholder="Hook" className="quiet quiet-w" value=${x.hook} onChange=${val(v=>api.patch("ideas",x.id,{hook:v}))} style=${{display:"block",width:"100%",fontSize:11,color:"var(--muted)",marginLeft:-3,padding:"1px 3px"}}/>
          </div>`)}
        </div>
        <button type="button" className="add-row" style=${{fontSize:12.5,gap:8}} onClick=${()=>api.add("ideas",{id:uid("i"),title:"New idea",hook:"",concept:"",platform:"Instagram",type:"Reel",collabId:"",scheduledDate:""})}>
          <span className="add-dot" style=${{width:18,height:18,fontSize:11}}>+</span><span>Add idea</span></button>
      </div>`:html`<button type="button" onClick=${()=>setSidebar(true)} style=${{width:"100%",height:"100%",minHeight:220,border:0,background:"transparent",writingMode:"vertical-rl",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--muted)"}}>Unscheduled · ${unsD.length+unsI.length}</button>`}
    </aside>
  </div>`;
}

/* ---------- Contacts ---------- */
function Contacts(p){
  const {st,api,cFilter,setCFilter,cSort,setCSort,setOpen,setOpenContact,setTab,askDelete,newCollab}=p;
  const {contacts,collabs,deliverables}=st;
  const [search,setSearch]=useState("");
  const q=search.trim().toLowerCase();
  const rows=contacts.filter(c=>cFilter==="All statuses"||c.status===cFilter)
    .filter(c=>!q||[c.brand,c.person,c.email,c.social].some(v=>(v||"").toLowerCase().includes(q)))
    .slice().sort((a,b)=>{
    if(cSort==="Brand A–Z")return (a.brand||"").localeCompare(b.brand||"");
    if(cSort==="Last contact")return (b.lastContactDate||"").localeCompare(a.lastContactDate||"");
    return (a.followUpDate||"9999").localeCompare(b.followUpDate||"9999");
  });
  const addContact=()=>{setCFilter("All statuses");setCSort("Follow-up date");api.add("contacts",{id:uid("c"),brand:"New brand",person:"",email:"",website:"",social:"",folder:"",lastContactDate:"",followUpDate:TODAY,status:"No response"})};

  return html`<div className="page" style=${{paddingTop:24}}>
    <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
      <h2 style=${{fontSize:24,fontWeight:700,margin:0,letterSpacing:"-.035em"}}>Contacts</h2>
      <span className="num" style=${{fontSize:12.5,color:"var(--muted)"}}>${rows.length} of ${contacts.length}</span>
      <div style=${{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <input type="search" aria-label="Search contacts" className="sel-box" placeholder="Search brand, person, email…" value=${search} onChange=${val(setSearch)} style=${{width:200}}/>
        <select id="c-filter" aria-label="Filter by relationship" className="sel-box" value=${cFilter} onChange=${val(setCFilter)}><${Options} list=${["All statuses"].concat(CSTATUS)}/></select>
        <select id="c-sort" aria-label="Sort" className="sel-box" value=${cSort} onChange=${val(setCSort)}><${Options} list=${["Follow-up date","Brand A–Z","Last contact"]}/></select>
        <button type="button" className="btn-dark" style=${{padding:"6px 14px",fontSize:12.5,borderRadius:9}} onClick=${addContact}>Add contact</button>
      </div>
    </div>
    <div className="ctable">
      <div className="crow head">${["Brand","Contact","Email","Relationship","History","Last contacted","Contact again",""].map((h,i)=>html`<span key=${i} className="kicker">${h}</span>`)}</div>
      ${rows.length===0&&html`<p style=${{color:"var(--muted)",padding:"16px 8px",margin:0}}>No contacts with this status.</p>`}
      ${rows.map(c=>{
        const due=c.followUpDate&&c.followUpDate<=TODAY;
        const mine=collabs.filter(x=>x.contactId===c.id);
        const bold=c.status==="Follow up"||c.status==="No response";
        return html`<div key=${c.id} className="crow">
          <div style=${{minWidth:0}}>
            <input id=${"cb-"+c.id} aria-label="Brand" className="cin" value=${c.brand} onChange=${val(v=>api.patch("contacts",c.id,{brand:v}))} style=${{display:"block",fontSize:13.5,fontWeight:500}}/>
            <input id=${"cl-"+c.id} aria-label="Social handle" placeholder="@handle" className="cin" value=${c.social||""} onChange=${val(v=>api.patch("contacts",c.id,{social:v}))} style=${{display:"block",fontSize:11,color:"var(--muted)",padding:"0 5px"}}/>
          </div>
          <input id=${"cp-"+c.id} aria-label="Contact person" placeholder="Name" className="cin" value=${c.person} onChange=${val(v=>api.patch("contacts",c.id,{person:v}))} style=${{fontSize:12.5}}/>
          <input id=${"ce-"+c.id} aria-label="Email" placeholder="email@brand.com" className="cin" value=${c.email} onChange=${val(v=>api.patch("contacts",c.id,{email:v}))} style=${{fontSize:12,color:"var(--ink-2)"}}/>
          <select id=${"cs-"+c.id} aria-label="Relationship" className="qsel" value=${c.status} onChange=${val(v=>api.patch("contacts",c.id,{status:v},0))}
            style=${{color:c.status==="Hard no"?"var(--faint)":bold?"var(--ink)":"var(--ink-2)",fontWeight:bold?500:400}}><${Options} list=${CSTATUS}/></select>
          <button type="button" className="num" onClick=${()=>{if(mine.length){setTab("dash");setOpen(mine[0].id)}else newCollab("Potential",c)}}
            style=${{justifySelf:"start",background:"transparent",border:0,padding:0,fontSize:12,color:"var(--ink-2)",textDecoration:"underline",textUnderlineOffset:2}}>${mine.length===0?"Start collab":mine.length===1?"1 collab":mine.length+" collabs"}</button>
          <input id=${"clc-"+c.id} type="date" aria-label="Last contacted" className="date-in num" value=${c.lastContactDate||""} onChange=${val(v=>api.patch("contacts",c.id,{lastContactDate:v},0))}/>
          <span className=${due?"due":""} style=${{display:"block"}}>
            <input id=${"cf-"+c.id} type="date" aria-label="Contact again" className="date-in num" value=${c.followUpDate||""} onChange=${val(v=>api.patch("contacts",c.id,{followUpDate:v},0))}/>
          </span>
          <span style=${{display:"flex",gap:2,justifySelf:"end"}}>
            <button type="button" className="x" aria-label=${"Open "+c.brand} title="See more" onClick=${()=>setOpenContact(c.id)}>→</button>
            <button type="button" className="x" aria-label=${"Delete "+c.brand} onClick=${()=>askDelete("Delete "+c.brand+"?",mine.length?"This contact has "+mine.length+(mine.length===1?" collaboration":" collaborations")+". They will be deleted too.":"The contact will be removed.",()=>{
              const ids=mine.map(x=>x.id);
              const dels=deliverables.filter(d=>ids.includes(d.collabId));
              api.remove([["contacts",c.id],...ids.map(id=>["collabs",id]),...dels.flatMap(d=>[["deliverables",d.id],["tasks","cd-"+d.id]])]);
            })}>✕</button>
          </span>
        </div>`;
      })}
    </div>
  </div>`;
}

/* ---------- Archive ---------- */
function Archive(p){
  const {st,api,dkk,setOpen,askDelete}=p;
  const collabs=st.collabs.filter(c=>c.archived).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const tasks=st.tasks.filter(x=>x.archived&&(x.createdAt||0)>=TASKS_SINCE).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return html`<div className="page" style=${{paddingTop:24}}>
    <h2 style=${{fontSize:24,fontWeight:700,margin:"0 0 18px",letterSpacing:"-.035em"}}>Archive</h2>

    <div style=${{marginBottom:28}}>
      <h3 style=${{fontSize:15,fontWeight:600,margin:"0 0 10px",letterSpacing:"-.018em"}}>Collaborations</h3>
      ${collabs.length===0&&html`<p style=${{color:"var(--muted)",fontSize:13,margin:0}}>Nothing archived yet.</p>`}
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${collabs.map(c=>html`<div key=${c.id} className="card" style=${{padding:"11px 15px",display:"flex",alignItems:"center",gap:12}}>
          <span style=${{flex:1,minWidth:0,fontSize:13.5,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer"}} onClick=${()=>setOpen(c.id)}>${c.brand}</span>
          <span className="num" style=${{fontSize:12.5,color:"var(--ink-2)"}}>${kr(dkk(c))}</span>
          <span style=${{fontSize:11.5,color:"var(--muted)"}}>${c.stage}</span>
          <button type="button" className="btn" style=${{padding:"4px 10px",fontSize:11.5}} onClick=${()=>api.patch("collabs",c.id,{archived:false},0)}>Unarchive</button>
        </div>`)}
      </div>
    </div>

    <div>
      <h3 style=${{fontSize:15,fontWeight:600,margin:"0 0 10px",letterSpacing:"-.018em"}}>Tasks</h3>
      ${tasks.length===0&&html`<p style=${{color:"var(--muted)",fontSize:13,margin:0}}>Nothing archived yet.</p>`}
      <div style=${{display:"flex",flexDirection:"column",gap:8}}>
        ${tasks.map(x=>html`<div key=${x.id} className="card" style=${{padding:"11px 15px",display:"flex",alignItems:"center",gap:12}}>
          <span style=${{flex:1,minWidth:0,fontSize:13.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${x.title}</span>
          <span style=${{fontSize:11.5,color:"var(--muted)"}}>${/^\d{4}-\d{2}-\d{2}$/.test(x.group||"")?fmtDate(x.group):x.group}</span>
          <button type="button" className="btn" style=${{padding:"4px 10px",fontSize:11.5}} onClick=${()=>api.patch("tasks",x.id,{archived:false},0)}>Unarchive</button>
          <button type="button" className="x" aria-label="Delete task" onClick=${()=>askDelete("Delete this task?","“"+x.title+"” will be permanently removed.",()=>api.remove([["tasks",x.id]]))}>✕</button>
        </div>`)}
      </div>
    </div>
  </div>`;
}

/* ---------- Contact panel ---------- */
function ContactPanel(p){
  const {contact:oc,st,api,dkk,onClose,askDelete,setOpen,setTab,newCollab}=p;
  const mine=st.collabs.filter(x=>x.contactId===oc.id).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const openCollab=id=>{onClose();setTab("dash");setOpen(id)};
  const fields=[
    {k:"person",label:"Contact person",value:oc.person},
